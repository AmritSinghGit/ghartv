name: Nova TV-first exact source
on:
  push:
    paths: ['.github/workflows/tv-first-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - run: git archive --format=zip HEAD -o /tmp/nova-tv-first-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nova-tv-first-source
          path: /tmp/nova-tv-first-source.zip
          retention-days: 2
