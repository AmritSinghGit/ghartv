name: Apply GharTV Review60 source
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/review60-apply.yml','.review60.patch.part*']
permissions:
  contents: write
concurrency:
  group: ghartv-review60-apply
  cancel-in-progress: false
jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'
      ANDROID_USER_HOME: /tmp/ghartv-review60-android
      ANDROID_EMULATOR_HOME: /tmp/ghartv-review60-android
      ANDROID_AVD_HOME: /tmp/ghartv-review60-avd
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify exact lease and apply bounded Review60 patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT=599bdfcf4921eaa5b2ddf8ec4fe55b442be78560
          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git ls-remote origin refs/heads/codex/ghartv-remove-auto-preview | cut -f1)" = "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          printf '%s\n' .github/workflows/review60-apply.yml .review60.patch.part00 .review60.patch.part01 .review60.patch.part02 | sort > /tmp/review60-expected
          printf '%s\n' "${changed[@]}" > /tmp/review60-actual
          diff -u /tmp/review60-expected /tmp/review60-actual
          cat .review60.patch.part* > /tmp/review60.patch.gz.b64
          echo "9636f3ad2ddb1e21844837dd871d7f63300238b006d8ae24d4fd81dcc3cbeda8  /tmp/review60.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/review60.patch.gz.b64 > /tmp/review60.patch.gz
          gzip -dc /tmp/review60.patch.gz > /tmp/review60.patch
          echo "1b821288fbcde4239d05b5c2f6dcb7fe4fad479d781f9b120aaf6e4fa45154c3  /tmp/review60.patch" | sha256sum -c -
          git apply --check /tmp/review60.patch
          git apply --index /tmp/review60.patch
          git diff --cached --check
      - name: Run source contracts on the patched tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/tv-first/check_contract.py
          python tools/network_recovery_check.py
          python tools/tv-open/test_reopen.py
          python tools/tv-open/test_cold_start_dns.py
          python tools/provider-access/generate_android_players.py --check
          node --test tools/provider-access/player-options.test.mjs
          python tools/tv-first/test_review_clock.py
          python tools/tv-first/test_collect_review_interactions.py
          python tools/tv-first/test_tv_identity.py
          python -m py_compile tools/tv-first/package_review60.py
      - name: Compile and run the Review38/Jio and IPTV cache recovery gate
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
          if ! command -v ffmpeg >/dev/null; then
            timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
            timeout 120 sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p android-tv/app/src/main/assets android-tv/app/src/debug/assets /tmp/ghartv-review60-proof "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -t 30 -an -c:v libx264 -preset fast -crf 32 -pix_fmt yuv420p -movflags +faststart android-tv/app/src/main/assets/ghartv-native-check.mp4
          cp android-tv/app/src/main/assets/ghartv-native-check.mp4 android-tv/app/src/debug/assets/preview-fixture.mp4
          (cd android-tv && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 assembleRelease assembleDebug assembleDebugAndroidTest)
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | avdmanager create avd --name GHARTV_REVIEW60_FOCUSED --package 'system-images;android-36;google_apis;x86_64' --path "$ANDROID_AVD_HOME/GHARTV_REVIEW60_FOCUSED.avd"
          "$ANDROID_HOME/emulator/emulator" -avd GHARTV_REVIEW60_FOCUSED -port 5580 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan -memory 2048 > /tmp/ghartv-review60-proof/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS+180))
          until [ "$(adb -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            kill -0 "$emulator_pid"
            [ "$SECONDS" -lt "$deadline" ]
            sleep 2
          done
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.Review60JioBaselineAndIptvCacheTest,in.ghartv.nova.PreviewControllerTest,in.ghartv.nova.Review38RegressionTest in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/ghartv-review60-proof/focused.txt
          grep -q 'OK (23 tests)' /tmp/ghartv-review60-proof/focused.txt
          ! grep -q 'FAILURES!!!' /tmp/ghartv-review60-proof/focused.txt
          rm -f android-tv/app/src/main/assets/ghartv-native-check.mp4 android-tv/app/src/debug/assets/preview-fixture.mp4
      - name: Commit Review60 application source under the existing branch lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ghartv-remove-auto-preview | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'GharTV Review Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(review60): restore Review38 Jio transport and accelerate IPTV cache'
          git push origin HEAD:refs/heads/codex/ghartv-remove-auto-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-review60-focused-proof
          path: /tmp/ghartv-review60-proof/
          retention-days: 7
