name: Apply exact Review62 source patch
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/review62-apply.yml','.review62/**']
permissions:
  contents: write
concurrency:
  group: ghartv-review62-source-writer
  cancel-in-progress: false
jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore(review62) stage exact source patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify, apply and publish one source commit
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=ee0cde00f93b1f6798264da72e1381290909587a
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          unexpected="$(git diff --name-only HEAD^ HEAD | grep -Ev '^(\.github/workflows/review62-apply\.yml|\.review62/review62\.patch\.part[0-9]{2})$' || true)"
          test -z "$unexpected"
          cat .review62/review62.patch.part* > /tmp/review62.patch
          echo '0f8aba15d0063043145575a4ff48f6fc48bdbba5fb401b3bbc8c684cd084295e  /tmp/review62.patch' | sha256sum -c -
          git apply --check /tmp/review62.patch
          git apply --whitespace=nowarn /tmp/review62.patch
          python tools/tv-first/check_contract.py
          changed="$(git diff --name-only)"
          ! grep -E '^android-tv/app/src/main/java/in/ghartv/nova/(Iptv|FlixMomo|FilmTor)' <<<"$changed"
          git rm -r .review62 .github/workflows/review62-apply.yml
          git add -A
          git config user.name 'Amrit Singh'
          git config user.email '66160706+AmritSinghGit@users.noreply.github.com'
          git commit -m 'fix(review62): recover Jio media DNS and diagnostic evidence'
          git push origin HEAD:codex/ghartv-remove-auto-preview
