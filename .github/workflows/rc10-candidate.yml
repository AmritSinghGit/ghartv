name: GharTV RC10 compiled review
on:
  push:
    branches: [codex/ghartv-remove-auto-preview]
    paths: ['.github/workflows/rc10-candidate.yml']
permissions:
  contents: write
concurrency:
  group: ghartv-rc10-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      GHARTV_DISABLE_KEYCHAIN: '1'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Validate source, embedded launcher and retained TV behavior
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/ghartv-remove-auto-preview
          python tools/rc10/delivery_fix.py
          grep -q 'versionCode = 28' android-tv/app/build.gradle.kts
          python tools/tv-first/check_contract.py
          mkdir -p /tmp/preview-test
          javac -d /tmp/preview-test android-tv/app/src/main/java/in/ghartv/nova/PreviewGate.java tools/tv-first/PreviewGateSmoke.java
          java -cp /tmp/preview-test PreviewGateSmoke
          npm ci --ignore-scripts --prefix web-player
          npm ci --ignore-scripts --prefix web-player/browser-tools
          node --test web-player/test/*.mjs | tee /tmp/rc10-node-tests.txt
          git diff --check
      - name: Commit checked native source before compiling; refuse competing writes
        id: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ghartv-remove-auto-preview | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'GharTV candidate builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ghartv): finalize RC10.1 bootstrap and minimal browser runtime'
            git push origin HEAD:refs/heads/codex/ghartv-remove-auto-preview
          fi
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "GHARTV_WEB_SHA=$sha" >> "$GITHUB_ENV"
      - name: Compile Android release and instrumentation package
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd android-tv
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleRelease assembleDebugAndroidTest
      - name: Check real local web, films, owner and responsive public pages
        env:
          GHARTV_TEST_BROWSER: /usr/bin/google-chrome
        run: node tools/rc10/check_ui.mjs
      - name: Record public provider verification status without bypass or credentials
        run: |
          mkdir -p /tmp/ghartv-provider-probe
          set +e
          printf '%s' '{"action":"search","query":"Dune","route":"direct"}' | timeout 75s env -i PATH="$PATH" HOME=/tmp/ghartv-provider-probe LANG=en_US.UTF-8 GHARTV_FILM_EXECUTABLE=/usr/bin/google-chrome node web-player/film-browser-worker.mjs > /tmp/ghartv-ui/LIVE_PROVIDER_CHECK.json
          code=$?
          set -e
          python - "$code" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('/tmp/ghartv-ui/LIVE_PROVIDER_CHECK.json')
          try:v=json.loads(p.read_text())
          except Exception:v={'ok':False,'error':'PROVIDER_PROBE_NO_VALID_RESPONSE','exit_code':int(sys.argv[1])}
          v.update(playbackVerified=False,torLiveCheck='NOT_EXECUTED',physicalTV='NOT_EXECUTED')
          p.write_text(json.dumps(v,indent=2)+'\n');print(json.dumps(v))
          PY
      - name: Package and independently validate the complete delivery
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fLsS --connect-timeout 15 --max-time 120 --retry 1 https://github.com/AmritSinghGit/ghartv/releases/download/v0.5.4-rc8/GharTV-Jio-Live-v0.5.4-rc8-pre-birthday-recovery.apk -o /tmp/ghartv-public-reference.apk
          python tools/package_owner_review.py
          cp /tmp/ghartv-ui/*.json /tmp/ghartv-owner-candidate/
          cp /tmp/rc10-node-tests.txt /tmp/ghartv-owner-candidate/
          python - <<'PY'
          import json,os,subprocess,zipfile,hashlib,re,io
          from pathlib import Path
          out=Path('/tmp/ghartv-owner-candidate');source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          node_log=(out/'rc10-node-tests.txt').read_text();assert '# pass 20' in node_log and '# fail 0' in node_log
          with zipfile.ZipFile(out/'GHARTV_RC10_1_REVIEW.zip') as z:
            assert z.testzip() is None
            root='GHARTV_RC10_1_REVIEW/'
            for line in z.read(root+'SHA256SUMS').decode().splitlines():
              digest,name=line.split('  ',1);assert hashlib.sha256(z.read(root+name)).hexdigest()==digest
            for n in ('RUN_GHARTV_WEB.command','PREPARE_GHARTV_UPDATE.command','RUN_GHARTV_REVIEW.command','GHARTV_SYNC_CURRENT_AND_REPORT.command'):
              p=Path('/tmp')/n;text=z.read(root+n).decode();p.write_text(text);subprocess.run(['bash','-n',str(p)],check=True)
              for delimiter in ('SEED','PY'):
                if "<<'"+delimiter+"'\n" in text:compile(text.split("<<'"+delimiter+"'\n",1)[1].split('\n'+delimiter+'\n',1)[0],n,'exec')
            manifest=json.loads(z.read(root+'assets/review-manifest.json'));assert manifest['source_sha']==source and manifest['version_code']==28
            with zipfile.ZipFile(io.BytesIO(z.read(root+'assets/GharTV-review-companion.zip'))) as companion:
              assert not any(n.lower().endswith(('.woff','.woff2','.ttf','.otf')) for n in companion.namelist())
          v={'schema':'ghartv.rc10-validation.v1','application_source':source,'workflow_run':os.environ['GITHUB_RUN_ID'],'android_release':'COMPILED_UNSIGNED','instrumentation_package':'COMPILED_NOT_EXECUTED','node_tests':20,'preview_gate_assertions':29,'tv_contract':'PASS_9_SOURCE_RULES','bootstrap_embedded_python':'COMPILED_AND_VERIFIED','all_bundle_checksums':'PASS','web_ui':json.loads((out/'UI_VALIDATION.json').read_text()),'provider_probe':json.loads((out/'LIVE_PROVIDER_CHECK.json').read_text()),'owner_mac_execution':False,'physical_tv_playback':False,'new_signed_apk':False,'production_feed_changed':False,'native_writer_lease':'UNBOUND_REMOTE_SOURCE_ONLY'}
          (out/'VALIDATION.json').write_text(json.dumps(v,indent=2)+'\n')
          delivery=json.loads((out/'DELIVERY.json').read_text());delivery.update(workflow_run=os.environ['GITHUB_RUN_ID'],validation='VALIDATION.json');(out/'DELIVERY.json').write_text(json.dumps(delivery,indent=2)+'\n')
          subprocess.run(['git','archive','--format=zip','HEAD','-o',str(out/'GHARTV_RC10_1_SOURCE.zip')],check=True)
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          print(json.dumps(delivery));print(json.dumps(v))
          PY
      - name: Publish RC10.1 review without household rollout
        run: |
          set -euo pipefail
          gh release create v0.6.0-rc10.1 /tmp/ghartv-owner-candidate/GHARTV_RC10_1_REVIEW.zip /tmp/ghartv-owner-candidate/GHARTV_RC10_1_SOURCE.zip /tmp/ghartv-owner-candidate/GharTV-review-unsigned.apk /tmp/ghartv-owner-candidate/GharTV-review-companion.zip /tmp/ghartv-owner-candidate/review-manifest.json /tmp/ghartv-owner-candidate/GHARTV_SYNC_CURRENT_AND_REPORT.command /tmp/ghartv-owner-candidate/DELIVERY.json /tmp/ghartv-owner-candidate/VALIDATION.json /tmp/ghartv-owner-candidate/SHA256SUMS --repo AmritSinghGit/ghartv --target '${{ steps.source.outputs.sha }}' --prerelease --latest=false --title 'GharTV Nova RC10.1 — web first, independent films and provider verification' --notes-file REVIEW_060_RC10.md
      - name: Link this review on the public website; preserve household update feed
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          url='https://api.github.com/repos/AmritSinghGit/ghartv/contents/docs/index.html'
          def api(method,url,data=None):
            request=urllib.request.Request(url,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps(data).encode() if data else None)
            with urllib.request.urlopen(request,timeout=20) as r:return json.load(r)
          record={'production_feed_changed':False,'expected_prior_blob':'e1e596f9e20b72ebb3567bc1843cec3f48f3dee9'}
          try:
            old=api('GET',url+'?ref=main');assert old['sha']==record['expected_prior_blob'],'PUBLIC_PAGE_ADVANCED_PRESERVED'
            text=base64.b64decode(old['content']).decode()
            text=text.replace('v0.6.0-rc10/','v0.6.0-rc10.1/').replace('v0.6.0-rc10"','v0.6.0-rc10.1"').replace('GHARTV_RC10_REVIEW','GHARTV_RC10_1_REVIEW').replace('RC10 · web + independent films · code27','RC10.1 · web + independent films · code28')
            text=text.replace('Live FlixMomo search remains unverified after a cloud timeout; Tor and physical-TV acceptance are still pending.','Normal provider verification is supported, with a manual Browse FlixMomo option. Live playback, Tor and physical-TV acceptance are still pending.')
            saved=api('PUT',url,{'message':'docs(ghartv): link published RC10.1 review; household feed unchanged','branch':'main','sha':old['sha'],'content':base64.b64encode(text.encode()).decode()})
            record.update(status='SOURCE_PUBLISHED_PAGES_DEPLOYMENT_SEPARATE',commit=saved['commit']['sha'])
          except Exception as e:record.update(status='PUBLIC_SITE_UPDATE_HELD',reason=type(e).__name__)
          Path('/tmp/ghartv-owner-candidate/PUBLISHED_SITE.json').write_text(json.dumps(record,indent=2)+'\n');print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-rc10-1-review
          path: |
            /tmp/ghartv-owner-candidate/*
            /tmp/ghartv-ui/*
            /tmp/rc10-node-tests.txt
          retention-days: 7
