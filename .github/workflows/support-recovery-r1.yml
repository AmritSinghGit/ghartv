name: GharTV RC7 support recovery and cleanup
on:
  push:
    paths: ['.github/workflows/support-recovery-r1.yml']
permissions:
  contents: write
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRANCH: codex/ghartv-remove-auto-preview
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Materialize exact bounded repair source without private support data
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          expected={'tools/emulator_network_repair.py':'ec08033b3f0148a17b3f1f00bc67d3bf0d3e01728ff7833770334f2ab9dac23b','web-player/server.mjs':'d578cc7ca37c6ae770c7cb67de96046436dfe2009354b633d97213001aae704c','web-player/public/app.js':'7dbd5e9c764abbc76b10a0541c159262ef54ea12e2a6f21b9e957e446449a544','web-player/review-sync.mjs':'4410ea29d599315f91db3a859797b855322b88a11651cde54aa2735164dfd341','web-player/release-desk.mjs':'a97c12fb3ae7c8cb06f6775dc9fd04e74328173d64fef63445bbdef83fc34191'}
          for name,h in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          raw=base64.b64decode(''.join(Path('.support-recovery/part'+str(i)).read_text() for i in range(3)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='ccaf22650551bd53fe9355f5433f1d69d9687d44fd9c133319cf50395ce95da0'
          data=json.loads(lzma.decompress(raw))
          names={'tools/emulator_network_repair.py','tools/recovery-r1/recover_and_clean.py','tools/recovery-r1/recovery_cleanup_check.py','tools/recovery-r1/known-review-artifacts.json'}
          assert set(data)==names
          for name,text in data.items():
            assert len(text)<50000
            p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          p=Path('web-player/review-sync.mjs');s=p.read_text()
          old="collector_auth_verified:r.collector_auth==='SUCCESS'"
          assert s.count(old)==1;s=s.replace(old,"collector_auth_verified:['SUCCESS','VERIFIED_BY_SUPPORT_READ'].includes(r.collector_auth)")
          old="physical_tv:'NOT_VERIFIED',owner_decision:'REVIEW_PENDING'"
          new="physical_tv:'NOT_VERIFIED',owner_decision:r.owner_decision==='REJECTED_PLAYBACK_BLOCKED'?'REJECTED_PLAYBACK_BLOCKED':'REVIEW_PENDING',cleanup_count:Number.isSafeInteger(r.cleanup_count)&&r.cleanup_count>=0?r.cleanup_count:0,cleanup_bytes:Number.isSafeInteger(r.cleanup_bytes)&&r.cleanup_bytes>=0?r.cleanup_bytes:0"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('web-player/release-desk.mjs');s=p.read_text();old='export function invokeRelease(action,body={}){'
          assert s.count(old)==1;p.write_text(s.replace(old,old+"\n if(action==='publish')return Promise.resolve({ok:false,error:'RC7_PLAYBACK_REVIEW_REJECTED_PUBLICATION_HELD'});"))
          print('BOUNDED_SOURCE_VERIFIED_NO_PRIVATE_DATA')
          PY
      - name: Test recovery decision, protected cleanup, real HTTP origin and catalogue fallback
        run: |
          set -euo pipefail
          python tools/recovery-r1/recovery_cleanup_check.py
          node --check web-player/server.mjs
          node --check web-player/public/app.js
          node --check web-player/review-sync.mjs
          node --check web-player/release-desk.mjs
          node tools/rc7_transport_check.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {safeReceipt} from './web-player/review-sync.mjs';
          import {invokeRelease} from './web-player/release-desk.mjs';
          const r=safeReceipt({run_id:'GHARTV-CYAN-11-RECOVERY-20260916T000000Z-1',review_source:'a'.repeat(40),version:'0.6.0-rc7-network-diagnostics',version_code:23,status:'ACTION_REQUIRED',owner_decision:'REJECTED_PLAYBACK_BLOCKED',collector_auth:'VERIFIED_BY_SUPPORT_READ',cleanup_count:3,cleanup_bytes:123,private_support_report:'PRIVATE_NOT_FOR_UPLOAD',arbitrary_secret:'DO_NOT_RETURN'});
          assert.equal(r.collector_auth_verified,true);assert.equal(r.owner_decision,'REJECTED_PLAYBACK_BLOCKED');assert.equal(r.cleanup_count,3);assert.equal(r.cleanup_bytes,123);assert.ok(!JSON.stringify(r).includes('DO_NOT_RETURN'));assert.ok(!JSON.stringify(r).includes('PRIVATE_NOT_FOR_UPLOAD'));
          assert.equal((await invokeRelease('publish')).error,'RC7_PLAYBACK_REVIEW_REJECTED_PUBLICATION_HELD');
          console.log('SAFE_RECEIPT_AUTH_REJECTION_CLEANUP_COUNTS_AND_PUBLICATION_HOLD=PASS');
          JS
      - name: Commit tested source on same branch without APK or production changes
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          Path('RC7_SUPPORT_RECOVERY.md').write_text('''# RC7 support recovery R1 — same APK, playback still on hold

          The owner supplied the requested private support files. They were inspected privately, not uploaded to this public repository. The old helper considered DNS_UNAVAILABLE but not CHECK_TIMED_OUT. The latter is a whole-probe timeout, so this repair independently corroborates DNS twice before a conditional same-AVD cold boot. It uses only current Mac resolvers which pass direct checks; no wipe, account reset, new DNS provider or system-DNS edit. The existing app/code23 and signed bytes are verified before and after, not replaced. Clock difference is measured but not changed.

          The recovery bundle also applies the already-tested web transport source21d274237a8756644fa160bca115964498502f45 to the same managed runtime, with verified backup/rollback and exact process ownership. It fixes the safe receipt's collector-auth spelling and preserves the owner's rejected playback decision. Public publication is held in the local release action. Network reachability, installed bytes and web health are not playback acceptance.

          Cleanup is limited to known old delivery ZIP hashes, extracted trees proven byte-for-byte from those exact ZIPs, and loose duplicate evidence matching the retained original run. Current RC7, unknown/changed/symlink files, source checkouts, keys, saved sessions, app/AVD data and historical runs are preserved. Evidence is archived/read back before cleanup. A private removal manifest reports files and bytes actually removed. No broad Downloads, Docker or Git cleanup.

          One existing Obsidian lane note and allowlisted technical PR mirror are used; no private reports or feedback are published. Source/runtime/outcome identities stay separate. This release is a recovery tool, NOT a new APK or a production promotion. Tests use temporary fixture files, mocked DNS results and controlled HTTP/provider responses, not owner credentials or actual Mac execution. No live playback, Mac cleanup or new Obsidian write has been performed by this cloud job.
          ''')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/emulator_network_repair.py tools/recovery-r1 web-player/review-sync.mjs web-player/release-desk.mjs RC7_SUPPORT_RECOVERY.md
          git rm -r .support-recovery .github/workflows/support-recovery-r1.yml
          test -z "$(git diff --cached --name-only -- android-tv update/latest.json)"
          git commit -m 'fix: corroborated timeout recovery and hash-scoped cleanup for existing rejected RC7'
          git push origin HEAD:refs/heads/$BRANCH
          echo "RECOVERY_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Publish small complete recovery kit with exact identities
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,subprocess,zipfile,os
          root=Path('/tmp/ghartv-recovery-r1');kit=root/'GHARTV_RC7_RECOVERY';kit.mkdir(parents=True)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for src,dst in [('tools/recovery-r1/recover_and_clean.py','recover_and_clean.py'),('tools/emulator_network_repair.py','emulator_network_repair.py'),('tools/recovery-r1/recovery_cleanup_check.py','recovery_cleanup_check.py')]:shutil.copyfile(src,kit/dst)
          manifest=json.loads(Path('tools/recovery-r1/known-review-artifacts.json').read_text())
          paths=['tools/emulator_network_repair.py','web-player/server.mjs','web-player/public/app.js','web-player/review-sync.mjs','web-player/release-desk.mjs']
          manifest.update(schema='ghartv.rc7-support-recovery.v1',apk_unchanged=True,web_source='21d274237a8756644fa160bca115964498502f45',delivery_source=source,owner_execution='NOT_PERFORMED',production='HELD',payload={})
          for name in paths:
            dst=kit/'payload'/name;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,dst);manifest['payload'][name]=hashlib.sha256(dst.read_bytes()).hexdigest()
          (kit/'repair-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (kit/'RUN_GHARTV_RECOVERY.command').write_text('#!/bin/bash\nset -euo pipefail\numask 077\ncd "$(dirname "$0")"\nshasum -a 256 -c SHA256SUMS\nexec python3 ./recover_and_clean.py\n')
          (kit/'RUN_GHARTV_RECOVERY.command').chmod(0o700)
          shutil.copyfile('RC7_SUPPORT_RECOVERY.md',kit/'README.md')
          evidence={'source':source,'workflow_run':os.environ['GITHUB_RUN_ID'],'checks':'PASS: corroborated timeout gates, hash-only cleanup fixture and negative cases, real localhost origins, controlled catalogue failure, safe mirror, held publication','actual_mac_execution':False,'actual_files_removed_from_owner_mac':0,'actual_playback_verified':False,'new_apk':False}
          (kit/'VALIDATION.json').write_text(json.dumps(evidence,indent=2)+'\n')
          files=sorted(p for p in kit.rglob('*') if p.is_file());(kit/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(kit))+'\n' for p in files))
          archive=root/'GHARTV_RC7_RECOVERY.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(kit.rglob('*')):
              if p.is_file():z.write(p,p.relative_to(root))
          with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None
            for line in z.read('GHARTV_RC7_RECOVERY/SHA256SUMS').decode().splitlines():
              h,name=line.split('  ',1);assert hashlib.sha256(z.read('GHARTV_RC7_RECOVERY/'+name)).hexdigest()==h
          delivery={'source':source,'tag':'v0.6.0-rc7-recovery1','file':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'size':archive.stat().st_size}
          (root/'DELIVERY.json').write_text(json.dumps(delivery,indent=2)+'\n');print(json.dumps(delivery))
          PY
          gh release create v0.6.0-rc7-recovery1 /tmp/ghartv-recovery-r1/GHARTV_RC7_RECOVERY.zip /tmp/ghartv-recovery-r1/DELIVERY.json --repo AmritSinghGit/ghartv --target "$(git rev-parse HEAD)" --prerelease --title 'GharTV RC7 recovery R1 — same APK, verified cleanup' --notes-file RC7_SUPPORT_RECOVERY.md
      - uses: actions/upload-artifact@v4
        with:
          name: ghartv-rc7-recovery-r1
          path: |
            /tmp/ghartv-recovery-r1/GHARTV_RC7_RECOVERY.zip
            /tmp/ghartv-recovery-r1/DELIVERY.json
          retention-days: 2
