name: Record GharTV successor and RC9 R2
on:
  push:
    paths: ['.github/workflows/record-successor-r2.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Verify exact published R2 and update only control/handoff records
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fLsS --connect-timeout 15 --max-time 90 https://github.com/AmritSinghGit/ghartv/releases/download/v0.6.0-rc9-continuation-r2/GHARTV_RC9_CONTINUATION_R2.zip -o /tmp/r2.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          raw=Path('/tmp/r2.zip').read_bytes();bundle='197e951ddd39c7c4f22f07e628bb538fb1e2f812eb5b48c6e89ddbbba9e42aac'
          assert hashlib.sha256(raw).hexdigest()==bundle
          with zipfile.ZipFile('/tmp/r2.zip') as z:
            assert z.testzip() is None
            for line in z.read('GHARTV_RC9_CONTINUATION_R2/SHA256SUMS').decode().splitlines():
              h,n=line.split('  ',1);assert hashlib.sha256(z.read('GHARTV_RC9_CONTINUATION_R2/'+n)).hexdigest()==h
            command=z.read('GHARTV_RC9_CONTINUATION_R2/GHARTV_SYNC_CURRENT_AND_REPORT.command')
            assert hashlib.sha256(command).hexdigest()=='a6bfd744ba8740430bb98bda5cc961edfa945820909164a28aaf11e7187cb392'
            handoff=z.read('GHARTV_RC9_CONTINUATION_R2/GHARTV_SUCCESSOR_HANDOFF.md')
            for n in ('GHARTV_SUCCESSOR_HANDOFF.md','OPERON_RESOURCE_DIRECTIVE.md','GITHUB_AUDIT.md'):
              Path(n).write_bytes(z.read('GHARTV_RC9_CONTINUATION_R2/'+n))
          Path('GHARTV_SYNC_CURRENT_AND_REPORT.command').write_bytes(command)
          Path('CURRENT_HANDOFF.md').write_bytes(handoff)
          p=Path('REVIEW_CANDIDATE.json');r=json.loads(p.read_text())
          assert r['source_sha']=='c20e3ef5dc8ff5dbee52c338930a5c4ac30157e8' and r['version_code']==26
          r.update(owner_signed_apk_sha256='fb48d1f7fc8d01d28cdb9f2532003e1a5c508a62bd05e65f2902377f2efd0d8a',owner_mac_run='GHARTV-CYAN-14-20260918T154238Z-97081',owner_decision='REVIEW_PENDING_INSTALLATION_NOT_CONFIRMED',owner_execution_result='SIGNED_VERIFIED_EMULATOR_BOOT_TIMEOUT_NOT_INSTALLED',owner_command_sha256='a6bfd744ba8740430bb98bda5cc961edfa945820909164a28aaf11e7187cb392',production_approval=False)
          r['signed_artifact_presence']='RUN14_SIGNED_DIGEST_REPORTED_CURRENT_LOCAL_FILE_NOT_CHECKED'
          r['latest_owner_attempt']={'run':'GHARTV-CYAN-14-20260918T154238Z-97081','phase':'EMULATOR_SELECTION','status':'ACTION_REQUIRED','emulator':'UNCHANGED','blocker':'Hold','actual_port_stage':'BOOT_TIMEOUT_PROCESS_PRESERVED','code26_installed':False,'physical_tv':'NOT_VERIFIED'}
          r['latest_resource_receipt']={'run':'GHARTV-RUN14-RELIEF-20260918T191811Z-27146','relief':'NO_EXACT_NOVA_PROCESS_IDENTIFIED_NOTHING_STOPPED','files_deleted':0,'bytes_deleted':0,'pressure_before':'WARNING','pressure_after':'WARNING','installed_code_observed':None}
          r['continuation_delivery']={'revision':'RC9-CONTINUATION-R2','control_source':'e6fece6b3382e16c4d74efecb28892fb2ee26fa7','release_tag':'v0.6.0-rc9-continuation-r2','file':'GHARTV_RC9_CONTINUATION_R2.zip','sha256':bundle,'workflow_run':35431808559,'focused_checks':20,'application_unchanged':True,'companion_unchanged':True,'owner_execution':'NOT_PERFORMED','mac_speedup_measured':False}
          r['successor']={'chat_title':'GharTV Nova — Canonical Continuation','same_lane':'ghartv','handoff':'GHARTV_SUCCESSOR_HANDOFF.md','old_chat':'OWNER_REQUESTED_ARCHIVE_AFTER_HANDOFF','new_chat_id':'NOT_KNOWN','writer_lease':'MUST_BIND_EXISTING_LANE_IN_SUCCESSOR','obsidian_import':'PENDING_LOCAL_HANDOFF_COMMAND','all_chats_loaded':False}
          r['resource_directive']={'concurrent_lanes_allowed':True,'owner_control':'AmritSinghGit/operon PR39','fabric':'AmritSinghGit/operon PR56','authority_commit':'f13962cfee0b03ba557b5d2c28b6330007575687','authority_path':'tools/lane-continuity/RESOURCE_LIFECYCLE_DIRECTIVE_2026-09-19.md','local_cleanup_executed':False,'all_local_source_published':'NOT_PROVED'}
          p.write_text(json.dumps(r,indent=2)+'\n')
          if Path('.ghartv-owner-state.json').exists():
            p=Path('.ghartv-owner-state.json');s=json.loads(p.read_text());s.update(current_candidate='0.6.0-rc9-tv-first',current_candidate_sha=r['source_sha'],version_code=26,owner_decision=r['owner_decision'],mac_sync='RUN14_BOOT_FAILED_R2_RETRY_PENDING',owner_command_sha256=r['owner_command_sha256'],candidate_release_status='COMPILED_R2_DELIVERED_NOT_INSTALLED',next_action='Run resource/handoff audit; successor continues same code26 review when resource headroom permits. No new public approval.');p.write_text(json.dumps(s,indent=2)+'\n')
          pub=json.loads(Path('update/latest.json').read_text());assert pub['versionCode']==24 and pub['sourceCommit']=='59c130abc1283e66607315db916973553164064d'
          print('CONTROL_RECONCILED; PUBLIC24_UNCHANGED; LOCAL_MUTATION_NOT_PERFORMED')
          PY
          bash -n GHARTV_SYNC_CURRENT_AND_REPORT.command
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GHARTV_SYNC_CURRENT_AND_REPORT.command CURRENT_HANDOFF.md GHARTV_SUCCESSOR_HANDOFF.md OPERON_RESOURCE_DIRECTIVE.md GITHUB_AUDIT.md REVIEW_CANDIDATE.json .ghartv-owner-state.json
          git rm .github/workflows/record-successor-r2.yml
          test -z "$(git diff --cached --name-only -- android-tv update/latest.json)"
          git commit -m 'delivery: successor handoff and corrected RC9 R2 state; run14 not mislabelled unexecuted or installed'
          git push origin HEAD:main
          echo "CONTROL_COMMIT=$(git rev-parse HEAD)"
