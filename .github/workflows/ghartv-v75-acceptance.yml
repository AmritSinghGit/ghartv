name: GharTV Release75 evidence
on:
  push:
    branches:
      - release/v75-owner-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-exact-v75-app:
    name: Build and deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run deterministic TV and network tests
        shell: bash
        run: |
          set -euo pipefail
          bash tools/tv-first/run-fix-smokes.sh
          w=$(mktemp -d)
          trap 'rm -rf "$w"' EXIT
          j=android-tv/app/src/main/java/in/ghartv/nova
          javac -encoding UTF-8 -d "$w" "$j/PhoneLinkServer.java" tools/tv-first/PhoneLinkSmoke.java
          java -cp "$w" PhoneLinkSmoke
          javac -encoding UTF-8 -d "$w" "$j/TorWebUrlPolicy.java" tools/tv-first/TorWebUrlPolicySmoke.java "$j/FilmStartBudget.java" tools/tv-first/FilmStartBudgetSmoke.java
          java -cp "$w" in.ghartv.nova.TorWebUrlPolicySmoke
          java -cp "$w" in.ghartv.nova.FilmStartBudgetSmoke
      # ubuntu-latest has SDK command-line tools. The setup-android@v3
      # action is currently requesting the removed legacy "tools" package.
      - name: Install Android SDK 36 from runner command-line tools
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Use available JDK21 compiler for CI only
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("android-tv/app/build.gradle.kts")
          txt=p.read_text()
          original='options.forkOptions.executable = "/Applications/Android Studio.app/Contents/jbr/Contents/Home/bin/javac"'
          assert original in txt, "Original v75 Mac compiler setting changed"
          txt=txt.replace(original, 'options.forkOptions.executable = System.getenv("JAVA_HOME") + "/bin/javac"')
          p.write_text(txt)
          print("CI compiler adapted locally without changing recorded source")
          PY
      - name: Compile Android TV v75 debug package from archived Java sources
        working-directory: android-tv
        run: bash ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Confirm package version code
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-tv/app/build/outputs/apk/debug/app-debug.apk |
            grep "name='in.ghartv.nova' versionCode='75' versionName='0.7.1-qr-lan-corrected'"
