name: GharTV smooth review source snapshot
on:
  push:
    paths: ['.github/workflows/smooth-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      # RC10 successor: archive this exact existing implementation, never main or One Guide.
      - run: git archive --format=zip HEAD -o /tmp/ghartv-smooth-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ghartv-smooth-source
          path: /tmp/ghartv-smooth-source.zip
          retention-days: 3
