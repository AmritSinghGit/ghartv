name: GharTV existing provider flow observation
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/smooth-source-snapshot.yml']
permissions:
  contents: read
concurrency:
  group: ghartv-existing-review-entry
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Use the existing optional browser dependency
        working-directory: web-player/browser-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Observe public controls with the normal browser identity and no saved account
        working-directory: web-player/browser-tools
        run: |
          mkdir -p /tmp/ghartv-flow
          cat > /tmp/ghartv-observe.mjs <<'JS'
          import {createRequire} from 'node:module';import fs from 'node:fs';
          const require=createRequire(process.cwd()+'/package.json');const {chromium}=require('playwright-core');
          const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1280,height:720}});const page=await context.newPage();
          const evidence={schema:'ghartv.public-provider-flow-observation.v1',time:new Date().toISOString(),scope:'PUBLIC_HOME_SEARCH_DETAILS_AND_WATCH_CONTROL_NO_SIGNIN',protections_changed:false,playback_proven:false,pages:[]};
          const allowed=u=>/^https:\/\/(www\.)?flixmomo\.(app|st|bet)(\/|$)/i.test(u);
          async function inspect(stage){
            const item=await page.evaluate(()=>{
              const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
              const show=e=>{let r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none';};
              const controls=Array.from(document.querySelectorAll('a,button,[role="button"],[role="tab"],select,input')).filter(show).slice(0,130).map(e=>({tag:e.tagName,role:e.getAttribute('role'),type:e.getAttribute('type'),text:clean(e.innerText||e.getAttribute('aria-label')||e.placeholder).slice(0,100),path:e.tagName==='A'?new URL(e.getAttribute('href')||'',location.href).pathname:null,classes:typeof e.className==='string'?e.className.slice(0,140):'',options:e.tagName==='SELECT'?Array.from(e.options).slice(0,15).map(o=>clean(o.text)):null}));
              const cards=Array.from(document.querySelectorAll('a[href]')).filter(a=>show(a)&&a.querySelector('img')&&/^\/(movie|tv|show|title)\//i.test(new URL(a.href).pathname)).slice(0,8).map(a=>({href:a.href,title:a.innerText,alt:a.querySelector('img').alt,image:a.querySelector('img').currentSrc||a.querySelector('img').src,html:a.outerHTML.replace(/<script[^>]*>[\s\S]*?<\/script>/gi,'').slice(0,2200)}));
              return {url:location.origin+location.pathname,title:document.title,headings:Array.from(document.querySelectorAll('h1,h2,h3')).slice(0,20).map(e=>clean(e.textContent)),controls,cards,iframe_count:document.querySelectorAll('iframe').length,video_count:document.querySelectorAll('video').length};
            });item.stage=stage;evidence.pages.push(item);return item;
          }
          try{
            await page.goto('https://flixmomo.app/',{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(8000);let home=await inspect('home');
            if(!allowed(page.url())||/just a moment|verify.*human|access denied/i.test(home.title)||page.url().includes('/dummy')){evidence.stop='PROVIDER_VERIFICATION_OR_UNREGISTERED_ORIGIN';}
            else{
              await page.goto(new URL('/search?q=harry%20potter',page.url()).href,{waitUntil:'domcontentloaded',timeout:25000});await page.waitForTimeout(5000);let search=await inspect('search');
              const title=search.cards.find(c=>/\/movie\//.test(c.href));
              if(title&&allowed(title.href)){
                await page.goto(title.href,{waitUntil:'domcontentloaded',timeout:25000});await page.waitForTimeout(4000);await inspect('details');
                const watch=page.getByText(/^watch now$/i).first();
                if(await watch.isVisible().catch(()=>false)){
                  // Inspect the provider's next page, not extract/play any protected source.
                  await watch.click({timeout:5000});await page.waitForTimeout(4000);await inspect('watch-page');
                }else evidence.stop='WATCH_CONTROL_NOT_VISIBLE';
              }else evidence.stop='NO_VISIBLE_MOVIE_RESULT';
            }
          }catch(error){evidence.stop=error.name;evidence.error=String(error.message).slice(0,450);}
          finally{await browser.close();fs.writeFileSync('/tmp/ghartv-flow/PROVIDER_FLOW.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify({stop:evidence.stop,stages:evidence.pages.map(x=>({stage:x.stage,url:x.url,cards:x.cards.length,controls:x.controls.length}))}));}
          JS
          node /tmp/ghartv-observe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-provider-flow-observation
          path: /tmp/ghartv-flow/
          retention-days: 7
