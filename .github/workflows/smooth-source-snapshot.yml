name: GharTV smooth review source snapshot
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/smooth-source-snapshot.yml','tools/tv-first/repair_review_entry.py']
permissions:
  contents: write
  actions: read
jobs:
  review_entry:
    runs-on: macos-14
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve exact tested signing mechanism and inspect native browser stage
        run: |
          mkdir -p /tmp/ghartv-entry-proof
          gh run download 35988440720 --repo AmritSinghGit/ghartv --name ghartv-review-entry-proof --dir /tmp/ghartv-prior-entry
          python3 tools/tv-first/repair_review_entry.py
          bash -n GHARTV_OPEN_REVIEW.command
          cp GHARTV_OPEN_REVIEW.command /tmp/ghartv-entry-proof/
          python3 - <<'PY'
          from pathlib import Path
          import ast,hashlib,http.server,json,threading,tempfile,types,subprocess,shutil
          def embedded(path):return Path(path).read_text().split("<<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]
          source=embedded('GHARTV_OPEN_REVIEW.command');prior=embedded('/tmp/ghartv-prior-entry/GHARTV_OPEN_REVIEW.command')
          def funcs(text):return {n.name:ast.dump(n,include_attributes=False) for n in ast.parse(text).body if isinstance(n,ast.FunctionDef)}
          a,b=funcs(source),funcs(prior)
          for name in ('signing_values','signing_tools','prepare_signed','apk_identity','payload','artifact'):assert a[name]==b[name],name
          sig=json.loads(Path('/tmp/ghartv-prior-entry/SIGNING_VALIDATION.json').read_text());assert sig['status']=='PASS';sig['reused_from_verified_run']=35988440720
          Path('/tmp/ghartv-entry-proof/SIGNING_VALIDATION.json').write_text(json.dumps(sig,indent=2))
          m=types.ModuleType('browser_test');exec(compile(source,'entry','exec'),m.__dict__)
          class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):self.send_response(200);self.send_header('Content-Type','text/html');self.end_headers();self.wfile.write(b'<title>Local GharTV test</title>Local test')
            def log_message(self,*args):pass
          servers=[];out={'status':'FAIL','owner_browser':False,'provider_calls':0}
          try:
            for port in (8790,4371):
              srv=http.server.ThreadingHTTPServer(('127.0.0.1',port),H);threading.Thread(target=srv.serve_forever,daemon=True).start();servers.append(srv)
            with tempfile.TemporaryDirectory(prefix='ghartv-tabs-test-') as d:
              m.RUN=Path(d).resolve();targets=[{'id':'viewer','url':'http://127.0.0.1:8790/'},{'id':'analytics','url':'http://127.0.0.1:4371/'}]
              # Cloud test only: retain bounded stderr to locate Apple Event failures.
              base=m.call
              def observed(args,*pos,**kw):
                if str(args[0])!='/usr/bin/osascript':return base(args,*pos,**kw)
                try:
                  p=subprocess.run(list(map(str,args)),stdin=subprocess.DEVNULL,capture_output=True,text=True,timeout=30,env=m.environment())
                  out.setdefault('calls',[]).append({'exit':p.returncode,'stderr':p.stderr[-4000:]});return p
                except subprocess.TimeoutExpired as e:
                  out.setdefault('calls',[]).append({'timeout':True,'stderr':str(e.stderr or b'')[-4000:]});raise m.Hold('TEST_APPLE_EVENT_TIMEOUT')
              m.call=observed
              out['first']=m.reuse_tabs(targets);out['second']=m.reuse_tabs(targets)
              if out['first'].get('status')=='BROWSER_TABS_RECONCILED' and out['second'].get('status')=='BROWSER_TABS_RECONCILED' and len(out['second'].get('results',[]))==2 and all(r['status']=='REUSED_EXISTING_TAB' for r in out['second']['results']):out['status']='PASS'
          finally:
            for srv in servers:srv.shutdown();srv.server_close()
            Path('/tmp/ghartv-entry-proof/BROWSER_VALIDATION.json').write_text(json.dumps(out,indent=2));print(json.dumps(out))
            if out['status']!='PASS':subprocess.run(['/usr/sbin/screencapture','-x','/tmp/ghartv-entry-proof/cloud-browser-state.png'],timeout=5,check=False)
          assert out['status']=='PASS'
          PY
      - name: Publish verified entry and immutable handoff
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ghartv-remove-auto-preview | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'GharTV review-entry validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GHARTV_OPEN_REVIEW.command
          if ! git diff --cached --quiet; then git commit -m 'fix(review): original-key signing and native tab reuse verified';git push origin HEAD:refs/heads/codex/ghartv-remove-auto-preview;fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          p=Path('GHARTV_OPEN_REVIEW.command');out=Path('/tmp/ghartv-entry-proof');(out/p.name).write_bytes(p.read_bytes())
          data={'schema':'ghartv.review-entry-validation.v1','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'entry_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'apk_source_unchanged':'39363ee529e9f8f3c00dcab8fdd69b88aa5e175c','native_mac_signing_fixture':'PASS_UNCHANGED_MECHANISM_REUSED','native_safari_reuse':'PASS','owner_mac_execution':False,'owner_analytics_authenticated':False,'household_feed_changed':False}
          (out/'VALIDATION.json').write_text(json.dumps(data,indent=2));print(json.dumps(data))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-review-entry-proof
          path: /tmp/ghartv-entry-proof/
          retention-days: 7
