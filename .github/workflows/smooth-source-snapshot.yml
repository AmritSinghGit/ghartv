name: GharTV smooth review source snapshot
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/smooth-source-snapshot.yml']
permissions:
  contents: write
jobs:
  review_entry:
    runs-on: macos-14
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Preserve browser-optional behavior before the exact test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GHARTV_OPEN_REVIEW.command');s=p.read_text()
          old="    var app=Application(names[n]);if(!app.running())continue;running.push(names[n]);"
          new="    var app;try{app=Application(names[n]);if(!app.running())continue;}catch(uninstalled){continue;}running.push(names[n]);"
          if old in s:
            assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          else:assert new in s
          compile(s.split("<<'PY'\n",1)[1].rsplit('\nPY\n',1)[0],'GHARTV_OPEN_REVIEW.command','exec')
          PY
          bash -n GHARTV_OPEN_REVIEW.command
      - name: Exercise actual APK signing and verify repeat-run cache with a disposable key
        run: |
          mkdir -p /tmp/ghartv-entry-proof
          curl --proto '=https' --proto-redir '=https' -fLsS --connect-timeout 15 --max-time 90 https://github.com/AmritSinghGit/ghartv/releases/download/v0.6.0-rc10.6-remote-cursor/GharTV-code33-review-unsigned.apk -o /tmp/ghartv-code33.apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,secrets,subprocess,tempfile,types
          source=Path('GHARTV_OPEN_REVIEW.command').read_text().split("<<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]
          m=types.ModuleType('ghartv_entry_test');m.__file__=str(Path('GHARTV_OPEN_REVIEW.command').resolve());exec(compile(source,m.__file__,'exec'),m.__dict__)
          unsigned=Path('/tmp/ghartv-code33.apk');assert m.digest(unsigned)==m.APK_SHA
          with tempfile.TemporaryDirectory(prefix='ghartv-sign-test-') as d:
            root=Path(d).resolve();m.HOME=root;m.STATE=root/'Library/Application Support/GharTV/owner-review';m.CACHE=m.STATE/'artifact-cache';m.CURRENT=m.STATE/'current';m.RUN=m.STATE/'runs/test'
            m.mkdir(m.RUN);keyroot=m.mkdir(root/'Library/Application Support/GharTV/signing');key=keyroot/'ghartv-release.jks'
            password=secrets.token_hex(16);env={**os.environ,'FIXTURE_PASSWORD':password}
            subprocess.run(['keytool','-genkeypair','-keystore',str(key),'-storetype','JKS','-alias','existing','-keyalg','RSA','-keysize','2048','-validity','2','-dname','CN=GharTV disposable CI key','-storepass:env','FIXTURE_PASSWORD','-keypass:env','FIXTURE_PASSWORD'],env=env,check=True,capture_output=True)
            der=root/'fixture.der'
            subprocess.run(['keytool','-exportcert','-keystore',str(key),'-alias','existing','-storepass:env','FIXTURE_PASSWORD','-file',str(der)],env=env,check=True,capture_output=True)
            m.CERT=hashlib.sha256(der.read_bytes()).hexdigest()
            cfg=keyroot/'signing.env';cfg.write_text('GHARTV_SIGNING_STORE='+json.dumps(str(key))+'\nGHARTV_SIGNING_STORE_PASSWORD='+password+'\nGHARTV_SIGNING_KEY_ALIAS=existing\nGHARTV_SIGNING_KEY_PASSWORD='+password+'\n');cfg.chmod(0o600)
            tools,signenv=m.signing_tools(Path(os.environ['ANDROID_HOME']));first=m.prepare_signed(unsigned,tools,signenv)
            assert m.apk_identity(first,tools,signenv,33)==33 and m.payload(first)==m.payload(unsigned)
            cfg.unlink();second=m.prepare_signed(unsigned,tools,signenv);assert second==first and m.R['signing_mode']=='REUSED_EXISTING_VERIFIED_CODE33'
            m.CERT='0'*64
            try:m.apk_identity(first,tools,signenv,33);raise AssertionError('wrong certificate accepted')
            except m.Hold as e:assert str(e)=='ORIGINAL_CERTIFICATE_MISMATCH_NO_INSTALL'
          out={'status':'PASS','actual_macos':True,'actual_apksigner_and_zipalign':True,'actual_code33_unsigned_payload':True,'signed_payload_preserved':True,'wrong_certificate_rejected':True,'repeat_without_config_reused_signed_bytes':True,'signer':'DISPOSABLE_CI_KEY_NOT_OWNER_KEY','owner_mac_execution':False,'owner_key_accessed':False,'fixture_key_or_signed_apk_uploaded':False}
          Path('/tmp/ghartv-entry-proof/SIGNING_VALIDATION.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - name: Exercise actual Safari tab create and reuse with only local test pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import http.server,json,threading,tempfile,types
          source=Path('GHARTV_OPEN_REVIEW.command').read_text().split("<<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]
          m=types.ModuleType('ghartv_browser_test');m.__file__=str(Path('GHARTV_OPEN_REVIEW.command').resolve());exec(compile(source,m.__file__,'exec'),m.__dict__)
          class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):self.send_response(200);self.send_header('Content-Type','text/html');self.end_headers();self.wfile.write(b'<title>GharTV local navigation test</title><h1>Local tab-reuse test</h1>')
            def log_message(self,*args):pass
          servers=[]
          try:
            for port in (8790,4371):
              srv=http.server.ThreadingHTTPServer(('127.0.0.1',port),Handler);threading.Thread(target=srv.serve_forever,daemon=True).start();servers.append(srv)
            with tempfile.TemporaryDirectory(prefix='ghartv-tabs-test-') as d:
              m.RUN=Path(d).resolve();targets=[{'id':'viewer','url':'http://127.0.0.1:8790/'},{'id':'analytics','url':'http://127.0.0.1:4371/'}]
              first=m.reuse_tabs(targets);second=m.reuse_tabs(targets)
              out={'first':first,'second':second,'status':'PASS' if first.get('status')=='BROWSER_TABS_RECONCILED' and second.get('status')=='BROWSER_TABS_RECONCILED' and len(second.get('results',[]))==2 and all(r['status']=='REUSED_EXISTING_TAB' for r in second.get('results',[])) else 'FAIL','native_safari':True,'owner_browser':False,'real_analytics_service_tested':False,'provider_calls':0}
              Path('/tmp/ghartv-entry-proof/BROWSER_VALIDATION.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out));assert out['status']=='PASS'
          finally:
            for srv in servers:srv.shutdown();srv.server_close()
          PY
      - name: Commit only verified entry correction and record exact final bytes
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ghartv-remove-auto-preview | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'GharTV review-entry validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GHARTV_OPEN_REVIEW.command
          if ! git diff --cached --quiet; then
            git commit -m 'fix(review-entry): skip uninstalled browsers without spawning duplicate tabs'
            git push origin HEAD:refs/heads/codex/ghartv-remove-auto-preview
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          p=Path('GHARTV_OPEN_REVIEW.command');out=Path('/tmp/ghartv-entry-proof');(out/p.name).write_bytes(p.read_bytes())
          data={'schema':'ghartv.review-entry-validation.v1','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'entry_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'apk_source_unchanged':'39363ee529e9f8f3c00dcab8fdd69b88aa5e175c','native_mac_signing_fixture':'PASS','native_safari_reuse':'PASS','owner_mac_execution':False,'owner_analytics_authenticated':False,'household_feed_changed':False}
          (out/'VALIDATION.json').write_text(json.dumps(data,indent=2)+'\n');print(json.dumps(data))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-review-entry-proof
          path: /tmp/ghartv-entry-proof/
          retention-days: 7
