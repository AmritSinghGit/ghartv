name: Record Nova TV-first RC9 review
on:
  push:
    paths: ['.github/workflows/rc9-control-record.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Verify published bundle and update only canonical review records
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fLsS --max-time 90 https://github.com/AmritSinghGit/ghartv/releases/download/v0.6.0-rc9/GHARTV_RC9_REVIEW.zip -o /tmp/nova-rc9.zip
          git fetch --depth=1 origin c20e3ef5dc8ff5dbee52c338930a5c4ac30157e8
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,json,io,subprocess
          source='c20e3ef5dc8ff5dbee52c338930a5c4ac30157e8'
          data=Path('/tmp/nova-rc9.zip').read_bytes();assert hashlib.sha256(data).hexdigest()=='8f85126879629717569eee799a3f5e8c11d3e8b69f19d76a5a9dde4f58eec914'
          old=json.loads(Path('REVIEW_CANDIDATE.json').read_text());assert old['source_sha']=='59c130abc1283e66607315db916973553164064d'
          feed=json.loads(Path('update/latest.json').read_text());assert feed['versionCode']==24 and feed['sha256']=='b4f682c7b118c580b7f66e50555f23b58d4549ae194dfe55db57a836cc4b5467'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            prefix='GHARTV_RC9_REVIEW/';assert z.testzip() is None
            for line in z.read(prefix+'SHA256SUMS').decode().splitlines():
              h,n=line.split('  ',1);assert hashlib.sha256(z.read(prefix+n)).hexdigest()==h,n
            m=json.loads(z.read(prefix+'assets/review-manifest.json'));assert m['source_sha']==source and m['version_code']==26
            command=z.read(prefix+'GHARTV_SYNC_CURRENT_AND_REPORT.command');assert hashlib.sha256(command).hexdigest()=='b15cec2a35ad6b3b1fc3f01750bb028f4f1cdb5d53f3db8705adb63b0363a309'
            assert b'GHARTV_CYAN_REVIEW_14_HANDOFF' in command
            companion=z.read(prefix+'assets/GharTV-review-companion.zip');assert hashlib.sha256(companion).hexdigest()==m['companion_sha256']
          with zipfile.ZipFile(io.BytesIO(companion)) as z:
            for name in ('CURRENT_HANDOFF.md','GHARTV_LANE_PROGRESS.md','TV_EXPERIENCE_CONTRACT.json','REVIEW_060_RC9.md'):Path(name).write_bytes(z.read(name))
          Path('GHARTV_SYNC_CURRENT_AND_REPORT.command').write_bytes(command)
          contract_hash=hashlib.sha256(Path('TV_EXPERIENCE_CONTRACT.json').read_bytes()).hexdigest()
          for src,dst in [('OWNER_REVIEW_REQUIREMENTS.json','OWNER_REVIEW_REQUIREMENTS.json'),('tools/tv-first/VALIDATION.json','docs/rc9-tv-first-validation.json')]:
            content=subprocess.check_output(['git','show',source+':'+src]);Path(dst).write_bytes(content)
          pub={'version_name':feed['versionName'],'version_code':24,'source':feed['sourceCommit'],'signed_apk_sha256':feed['sha256'],'owner_decision':'APPROVED_WITH_LOCAL_REVIEW_WAIVED','review_completed':False,'publication_status':'PUBLIC_FEED_READBACK_VERIFIED','authorization_record':'update/release-code24-authorization.json','status_record':'update/release-code24-status.json','physical_tv':'NOT_VERIFIED'}
          last={'run_id':'GHARTV-NOVA-SELECT-20260918T070651Z-2231','version_code':24,'source':feed['sourceCommit'],'signed_apk_sha256':feed['sha256'],'result':'EXACT_NOVA_CODE24_FOREGROUND_VERIFIED','avd':'GharTV_Nova_Manual_google_tv_API36','serial':'emulator-5580','package':'in.ghartv.nova','apk_changed':False,'production_changed':False,'playback_verified':False,'obsidian':'RUN_NOTE_WRITTEN_AND_READBACK_VERIFIED','github_sync':'OWNER_PASTED_LOCAL_RESULT_NOT_AUTOMATIC_PRIVATE_UPLOAD'}
          r={**m,'application_source_sha':source,'release_tag':'v0.6.0-rc9','build_run':35321599367,'build_job':105525107583,'build_result':'SUCCESS','owner_decision':'REVIEW_PENDING_NOT_EXECUTED','production_approval':False,'publication_status':'PRERELEASE_REVIEW_ONLY_NOT_PUBLICLY_ADVERTISED','full_bundle_sha256':'8f85126879629717569eee799a3f5e8c11d3e8b69f19d76a5a9dde4f58eec914','owner_command_sha256':'b15cec2a35ad6b3b1fc3f01750bb028f4f1cdb5d53f3db8705adb63b0363a309','starter_sha256':'72174e8fc35aadd8503dae69e5261c04d59fd0e93a123102844fafc413539d73','tv_experience_contract_sha256':contract_hash,'public_release':pub,'rollback_reserve':old['rollback_reserve'],'last_owner_execution':last,'owner_feedback':{'screen':'CORRECT_NOVA_CODE24_NOT_ONE_GUIDE','decision':'REJECTED_MANUAL_PREVIEW_BUTTON_AND_DEFAULT_OFF_UX','new_code26_review_pending':True},'native_flixmomo_playback':'NOT_IMPLEMENTED','tor_routing':'NOT_IMPLEMENTED','measured_mac_speedup':None}
          r['rollback_reserve']['scope']='RECOVER_PUBLIC_CODE24_NOT_A_DOWNGRADE_FOR_NEW_CODE26'
          Path('REVIEW_CANDIDATE.json').write_text(json.dumps(r,indent=2)+'\n')
          p=Path('.ghartv-owner-state.json');state=json.loads(p.read_text());state.update(current_candidate=m['version_name'],current_candidate_sha=source,candidate_branch=m['branch'],candidate_pr=1,version_code=26,candidate_release='v0.6.0-rc9',candidate_release_status='COMPILED_ANDROID_PREVIEW_TESTED_REVIEW_OWNER_EXECUTION_PENDING',unsigned_apk_sha256=m['unsigned_sha256'],apk_sha256=None,owner_decision='REVIEW_PENDING_NOT_EXECUTED',owner_command_sha256=r['owner_command_sha256'],source_build_run=35321599367,source_build_result='SUCCESS',last_owner_execution=last,public_release=pub,public_approval=False,mac_sync='AWAITING_RC9_REVIEW14_RECEIPT',tv_experience_contract_sha256=contract_hash,next_action='Run the full compiled RC9/code26 bundle in existing Nova5580. Automatic muted focus-owned preview, no Preview12s button. Preserve explicit Off. Publiccode24 unchanged; fresh exact-owner approval required.');p.write_text(json.dumps(state,indent=2)+'\n')
          for name in ('CURRENT_HANDOFF.md','GHARTV_LANE_PROGRESS.md'):
            with Path(name).open('a') as f:f.write('\n\n## Verified RC9 delivery\nApplication `'+source+'`, build35321599367/job105525107583 SUCCESS including7 actual Android controller tests with generated local media,29 production-state checks and controlled browser regression checks. Full bundle `'+r['full_bundle_sha256']+'`. New Mac execution, live provider playback and new local Obsidian write remain pending. Publiccode24 and reserved25 unchanged. Latest actual owner selection is Nova5580/code24, not the rejected5554 One Guide screen.\n')
          print('RC9_REVIEW_AND_CONTRACT_RECORDED; PUBLICCODE24_UNCHANGED')
          PY
          bash -n GHARTV_SYNC_CURRENT_AND_REPORT.command
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_HANDOFF.md GHARTV_LANE_PROGRESS.md TV_EXPERIENCE_CONTRACT.json REVIEW_060_RC9.md OWNER_REVIEW_REQUIREMENTS.json GHARTV_SYNC_CURRENT_AND_REPORT.command REVIEW_CANDIDATE.json .ghartv-owner-state.json docs/rc9-tv-first-validation.json
          git rm .github/workflows/rc9-control-record.yml
          test -z "$(git diff --cached --name-only -- android-tv update/latest.json)"
          git commit -m 'delivery: Android-tested RC9 automatic-preview review and corrected experience contract; public24 unchanged'
          git push origin HEAD:main
          echo "CONTROL_DELIVERY_SHA=$(git rev-parse HEAD)"
          rm /tmp/nova-rc9.zip
