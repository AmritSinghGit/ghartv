name: Finalize GharTV Review59 bounded repair
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/review59-finalize.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ghartv-review59-finalize
  cancel-in-progress: false
jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'
      ANDROID_USER_HOME: /tmp/ghartv-review59-android
      ANDROID_EMULATOR_HOME: /tmp/ghartv-review59-android
      ANDROID_AVD_HOME: /tmp/ghartv-review59-avd
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify exact lease and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT=c450514bae49ab4cbafbe3551ac3b595ce62f282
          PATCH_SHA=4dd092d9aabb4378b14017686e5685d3fbed97d6745c192428f6d7fd6518ee20
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/codex/ghartv-remove-auto-preview | cut -f1)" = "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          printf '%s\n' '.github/workflows/review59-finalize.yml' > /tmp/expected-stage
          printf '%s\n' "${changed[@]}" > /tmp/actual-stage
          diff -u /tmp/expected-stage /tmp/actual-stage
          cat .review59-final.patch.part* > /tmp/review59-final.patch
          echo "$PATCH_SHA  /tmp/review59-final.patch" | sha256sum -c -
          git apply --check /tmp/review59-final.patch
          git apply --index /tmp/review59-final.patch
          git diff --cached --check
          mapfile -t applied < <(git diff --cached --name-only | sort)
          printf '%s\n' \
            android-tv/app/src/androidTest/java/in/ghartv/nova/NetworkFailureHttpClassificationTest.java \
            android-tv/app/src/androidTest/java/in/ghartv/nova/PreviewControllerTest.java \
            android-tv/app/src/main/java/in/ghartv/nova/IptvPlayerActivity.java \
            android-tv/app/src/main/java/in/ghartv/nova/NetworkFailure.java \
            android-tv/app/src/main/java/in/ghartv/nova/PlayerActivity.java \
            android-tv/app/src/debug/java/in/ghartv/nova/PreviewHarnessActivity.java | sort > /tmp/expected-applied
          printf '%s\n' "${applied[@]}" > /tmp/actual-applied
          diff -u /tmp/expected-applied /tmp/actual-applied
      - name: Run source contracts on the patched tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/tv-first/check_contract.py
          python tools/network_recovery_check.py
          python tools/tv-open/test_reopen.py
          python tools/tv-open/test_cold_start_dns.py
          python tools/provider-access/generate_android_players.py --check
          node --test tools/provider-access/player-options.test.mjs
          python tools/tv-first/test_review_clock.py
          python tools/tv-first/test_collect_review_interactions.py
          python tools/tv-first/test_tv_identity.py
          mkdir -p "$RUNNER_TEMP/ghartv-tor-policy"
          javac --release 8 -d "$RUNNER_TEMP/ghartv-tor-policy" android-tv/app/src/main/java/in/ghartv/nova/FilmTorFallback.java tools/tv-first/FilmTorFallbackCheck.java
          java -cp "$RUNNER_TEMP/ghartv-tor-policy" in.ghartv.nova.FilmTorFallbackCheck
          mkdir -p "$RUNNER_TEMP/nova-contract"
          javac -d "$RUNNER_TEMP/nova-contract" android-tv/app/src/main/java/in/ghartv/nova/PreviewGate.java tools/tv-first/PreviewGateSmoke.java android-tv/app/src/main/java/in/ghartv/nova/RemoteCursorState.java tools/tv-first/RemoteCursorSmoke.java
          java -cp "$RUNNER_TEMP/nova-contract" PreviewGateSmoke
          java -cp "$RUNNER_TEMP/nova-contract" RemoteCursorSmoke
      - name: Compile and run only the bounded new and previously failing Android tests
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
          if ! command -v ffmpeg >/dev/null; then
            timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
            timeout 120 sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p android-tv/app/src/main/assets android-tv/app/src/debug/assets /tmp/ghartv-review59-proof "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -t 30 -an -c:v libx264 -preset fast -crf 32 -pix_fmt yuv420p -movflags +faststart android-tv/app/src/main/assets/ghartv-native-check.mp4
          cp android-tv/app/src/main/assets/ghartv-native-check.mp4 android-tv/app/src/debug/assets/preview-fixture.mp4
          (cd android-tv && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest)
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | avdmanager create avd --name GHARTV_REVIEW59_FOCUSED --package 'system-images;android-36;google_apis;x86_64' --path "$ANDROID_AVD_HOME/GHARTV_REVIEW59_FOCUSED.avd"
          "$ANDROID_HOME/emulator/emulator" -avd GHARTV_REVIEW59_FOCUSED -port 5580 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan -memory 2048 > /tmp/ghartv-review59-proof/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS+180))
          until [ "$(adb -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            kill -0 "$emulator_pid"
            [ "$SECONDS" -lt "$deadline" ]
            sleep 2
          done
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.NetworkFailureHttpClassificationTest,in.ghartv.nova.PreviewControllerTest in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/ghartv-review59-proof/focused.txt
          grep -q 'OK (11 tests)' /tmp/ghartv-review59-proof/focused.txt
          ! grep -q 'FAILURES!!!' /tmp/ghartv-review59-proof/focused.txt
          rm -f android-tv/app/src/main/assets/ghartv-native-check.mp4 android-tv/app/src/debug/assets/preview-fixture.mp4
      - name: Commit bounded source under the existing branch lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ghartv-remove-auto-preview | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'GharTV Review Builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/review59-finalize.yml .review59-final.patch.part*
          git diff --cached --check
          git commit -m 'fix(review59): preserve recovery window and classify provider failures'
          git push origin HEAD:refs/heads/codex/ghartv-remove-auto-preview
