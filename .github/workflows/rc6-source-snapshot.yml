name: GharTV RC6 source snapshot
on:
  push:
    paths: ['.github/workflows/rc6-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - run: git archive --format=zip HEAD -o /tmp/ghartv-rc6-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ghartv-rc6-source
          path: /tmp/ghartv-rc6-source.zip
          retention-days: 2
