name: Apply bounded Review57 repair
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/apply-review57-bounded.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact bounded app patch and publish through the existing branch
        run: |
          set -euo pipefail
          BRANCH='codex/ghartv-remove-auto-preview'
          REMOTE_BEFORE=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$REMOTE_BEFORE" = "$GITHUB_SHA"
          cat .github/review57-patch-01.b64 .github/review57-patch-02.b64 .github/review57-patch-03.b64 .github/review57-patch-04.b64 .github/review57-patch-05.b64 | tr -d '\r\n' > /tmp/review57.patch.gz.b64
          echo '45cae353fb5a23c8f833da23c3077caaebe3633f401b33265435d21243dc434f  /tmp/review57.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/review57.patch.gz.b64 | gzip -d > /tmp/review57.patch
          echo 'a06d389a238f6532093e2196cb18740f7d98414ef09a63909cfc98cb0e4f6b6b  /tmp/review57.patch' | sha256sum -c -
          git apply --check /tmp/review57.patch
          git apply /tmp/review57.patch
          rm -f .github/review57-app.patch.gz.b64 .github/review57-patch-01.b64 .github/review57-patch-02.b64 .github/review57-patch-03.b64 .github/review57-patch-04.b64 .github/review57-patch-05.b64
          python tools/tv-first/check_contract.py
          python -m py_compile tools/tv-first/package_review57.py
          test "$(git diff --name-only | wc -l | tr -d ' ')" -ge 7
          git config user.name 'Amrit Singh'
          git config user.email 'reach.amritsingh@gmail.com'
          git add -A
          git commit -m 'Review57: keep submitted film search browser-only [skip ci]'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$BRANCH"
