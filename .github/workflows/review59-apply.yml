name: Apply GharTV Review59 source
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/review59-apply.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: ghartv-review59-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify lease and decode exact patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT=992c17a0deb293f88375a107e596bc9117b3982c
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
          test "${#changed[@]}" -eq 8
          expected=(
            .github/workflows/review59-apply.yml
            .review59.patch.part00 .review59.patch.part01 .review59.patch.part02
            .review59.patch.part03 .review59.patch.part04 .review59.patch.part05
            .review59.patch.part06
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/review59-expected-files
          printf '%s\n' "${changed[@]}" > /tmp/review59-actual-files
          diff -u /tmp/review59-expected-files /tmp/review59-actual-files
          cat .review59.patch.part* > /tmp/review59.patch.gz.b64
          echo "96660261de007bee341562001a3e7969b20306ea8c254524768e847ce5b39014  /tmp/review59.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/review59.patch.gz.b64 > /tmp/review59.patch.gz
          gzip -dc /tmp/review59.patch.gz > /tmp/review59.patch
          echo "0a59f10af65790e4c37f4b657d3f27304761776039ef5fd742d37ff947f28321  /tmp/review59.patch" | sha256sum -c -
          git apply --check /tmp/review59.patch
          git apply --index /tmp/review59.patch
          git rm .github/workflows/review59-apply.yml .review59.patch.part*
          git diff --cached --check
      - name: Run source contracts before publishing candidate source
        shell: bash
        run: |
          set -euo pipefail
          python tools/tv-first/check_contract.py
          python tools/network_recovery_check.py
          python tools/tv-open/test_reopen.py
          python tools/tv-open/test_cold_start_dns.py
          python tools/provider-access/generate_android_players.py --check
          node --test tools/provider-access/player-options.test.mjs
          python tools/tv-first/test_review_clock.py
          python tools/tv-first/test_collect_review_interactions.py
          python tools/tv-first/test_tv_identity.py
          mkdir -p "$RUNNER_TEMP/ghartv-tor-policy"
          javac --release 8 -d "$RUNNER_TEMP/ghartv-tor-policy" android-tv/app/src/main/java/in/ghartv/nova/FilmTorFallback.java tools/tv-first/FilmTorFallbackCheck.java
          java -cp "$RUNNER_TEMP/ghartv-tor-policy" in.ghartv.nova.FilmTorFallbackCheck
          mkdir -p "$RUNNER_TEMP/nova-contract"
          javac -d "$RUNNER_TEMP/nova-contract" android-tv/app/src/main/java/in/ghartv/nova/PreviewGate.java tools/tv-first/PreviewGateSmoke.java android-tv/app/src/main/java/in/ghartv/nova/RemoteCursorState.java tools/tv-first/RemoteCursorSmoke.java
          java -cp "$RUNNER_TEMP/nova-contract" PreviewGateSmoke
          java -cp "$RUNNER_TEMP/nova-contract" RemoteCursorSmoke
      - name: Commit exact Review59 source and dispatch canonical build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "GharTV Review Builder"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(review59): recover Jio and IPTV through secure DNS and Tor"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tv-experience-contract.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
