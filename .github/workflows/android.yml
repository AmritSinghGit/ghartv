name: Android TV build
on:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - 'VALIDATE_SOURCE.command'
      - '.github/workflows/android.yml'
      - 'tools/create_share_link.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve owner-requested public share link
        continue-on-error: true
        run: python3 tools/create_share_link.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate source
        run: bash ./VALIDATE_SOURCE.command
      - name: Build debug APK
        working-directory: android-tv
        run: ./gradlew --no-daemon :app:assembleDebug
