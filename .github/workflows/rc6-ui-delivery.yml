name: GharTV RC6 family focus and review delivery
on:
  push:
    paths: ['.github/workflows/rc6-ui-delivery.yml']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: codex/ghartv-remove-auto-preview
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Materialize only verified modifications to the current source
        shell: python
        run: |
          from pathlib import Path
          import base64,hashlib,json,lzma
          raw=base64.b64decode(''.join(Path('.rc6-prep/part'+str(i)).read_text() for i in range(3)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='69fe13eaff701bbc337c1d0af8752fe72a43cd57c13c4633f54714e76e45a753'
          data=json.loads(lzma.decompress(raw));assert data['base_sha']=='925ff930f325966d816db79a9d5f5a5c30e70bd2' and len(data['targets'])==26
          for name,expected in data['base'].items():
            p=Path(name);assert not p.is_absolute() and '..' not in p.parts
            assert name.startswith(('android-tv/','web-player/','docs/','tools/')) or name in ('CURRENT_HANDOFF.md','GHARTV_LANE_PROGRESS.md','REVIEW_060_RC6.md','OWNER_REVIEW_REQUIREMENTS.json','VALIDATE_SOURCE.command')
            if expected is None:assert not p.exists(),name
            else:assert hashlib.sha256(p.read_bytes()).hexdigest()==expected,name
          for name,hunks in data['operations'].items():
            p=Path(name);text=p.read_text() if p.exists() else ''
            for lo,hi,replacement in reversed(hunks):
              assert 0<=lo<=hi<=len(text)
              text=text[:lo]+replacement+text[hi:]
            assert hashlib.sha256(text.encode()).hexdigest()==data['targets'][name],name
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          p=Path('docs/owner.html');s=p.read_text();old='On demand · no automatic D1 polling';assert s.count(old)==1
          s=s.replace(old,'Manual refresh only. Detailed event rows load only when you request them.')
          old='<p class="privacy-note">Reported recently';assert s.count(old)==1
          s=s.replace(old,'<p class="section-note">This page can run on your Mac, but report data is read from the existing Cloudflare collector and D1 database.</p>'+old);p.write_text(s)
          Path('/tmp/ghartv-rc6-targets.json').write_text(json.dumps(list(data['targets'])))
          print('EXACT_SOURCE_OPERATIONS_VERIFIED=26_FILES; MANUAL_REPORTING_NOTICES_RETAINED=YES')
      - name: Focused family, scope, receipt and message checks
        run: |
          set -euo pipefail
          bash VALIDATE_SOURCE.command
          mkdir -p /tmp/ghartv-rules
          javac -d /tmp/ghartv-rules android-tv/app/src/main/java/in/ghartv/nova/GuideTimeline.java android-tv/app/src/main/java/in/ghartv/nova/FamilyMemberRules.java tools/GuideRulesSmoke.java tools/FamilyRulesSmoke.java
          java -cp /tmp/ghartv-rules GuideRulesSmoke
          java -cp /tmp/ghartv-rules FamilyRulesSmoke
          node --check web-player/public/app.js
          node --check web-player/owner-gateway.mjs
          node --check web-player/review-sync.mjs
          node tools/rc6_receipt_check.mjs
          node tools/owner-convergence-check.mjs
      - name: Compile actual Android RC6 release
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd android-tv
          bash gradlew --no-daemon --max-workers=2 :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/ghartv-rc6-badging.txt
          python - <<'PY'
          from pathlib import Path
          first=Path('/tmp/ghartv-rc6-badging.txt').read_text().splitlines()[0]
          assert "name='in.ghartv.nova'" in first and "versionCode='22'" in first and "versionName='0.6.0-rc6-family-focus'" in first
          print(first)
          PY
      - name: Check actual typed signing continuity and invalid-file rejection
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fLsS --max-time 90 https://github.com/AmritSinghGit/ghartv/releases/download/v0.5.4-rc8/GharTV-Jio-Live-v0.5.4-rc8-pre-birthday-recovery.apk -o /tmp/ghartv-public-reference.apk
          python tools/rc5_native_verify.py
      - name: Real browser UI, keyboard, scope, fullscreen and private feedback checks
        run: |
          set -euo pipefail
          npm --prefix web-player ci --ignore-scripts --no-audit --no-fund
          npm --prefix /tmp/ghartv-browser install --ignore-scripts --no-audit --no-fund playwright@1.55.1
          /tmp/ghartv-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/rc6_browser_check.mjs
      - name: Commit checked source on the existing review branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          subprocess.run(['git','add','--',*json.loads(Path('/tmp/ghartv-rc6-targets.json').read_text())],check=True)
          PY
          git rm -r .rc6-prep .github/workflows/rc6-ui-delivery.yml .github/workflows/rc6-source-snapshot.yml
          test -z "$(git diff --cached --name-only -- update/latest.json)"
          git commit -m 'feat: RC6 first-open focus, family management, keyboard web and safe receipt sync'
          git push origin HEAD:refs/heads/$BRANCH
          echo "APPLICATION_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Publish the full local review bundle, not a public TV update
        run: |
          set -euo pipefail
          python tools/package_owner_review.py
          gh release create v0.6.0-rc6 /tmp/ghartv-owner-candidate/* --repo AmritSinghGit/ghartv --target "$(git rev-parse HEAD)" --prerelease --title 'GharTV 0.6.0 RC6 — family, focus and review desk' --notes-file REVIEW_060_RC6.md
          echo 'REVIEW_BUNDLE_PUBLISHED=YES; OWNER_SIGNING_AND_EXECUTION=NOT_PERFORMED; PUBLIC_FEED=UNCHANGED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-rc6-owner-delivery
          path: |
            /tmp/ghartv-owner-candidate/GHARTV_RC6_REVIEW.zip
            /tmp/ghartv-owner-candidate/DELIVERY.json
            /tmp/ghartv-check-evidence/*.png
          retention-days: 2
          if-no-files-found: warn
