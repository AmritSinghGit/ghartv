name: Nova TV experience contract
on:
  # Superseded for this branch by review63-candidate.yml (it still asserted code61); run by hand if needed.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghartv-tv-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: prepare
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  contract:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          set -euo pipefail
          python tools/tv-first/check_contract.py
          python tools/network_recovery_check.py
          python tools/tv-open/test_reopen.py
          python tools/tv-open/test_cold_start_dns.py
          python tools/provider-access/generate_android_players.py --check
          node --test tools/provider-access/player-options.test.mjs
          python tools/tv-first/test_review_clock.py
          python tools/tv-first/test_collect_review_interactions.py
          python tools/tv-first/test_tv_identity.py
          mkdir -p "$RUNNER_TEMP/ghartv-tor-policy" "$RUNNER_TEMP/nova-contract"
          javac --release 8 -d "$RUNNER_TEMP/ghartv-tor-policy" android-tv/app/src/main/java/in/ghartv/nova/FilmTorFallback.java tools/tv-first/FilmTorFallbackCheck.java
          java -cp "$RUNNER_TEMP/ghartv-tor-policy" in.ghartv.nova.FilmTorFallbackCheck
          javac -d "$RUNNER_TEMP/nova-contract" android-tv/app/src/main/java/in/ghartv/nova/PreviewGate.java tools/tv-first/PreviewGateSmoke.java android-tv/app/src/main/java/in/ghartv/nova/RemoteCursorState.java tools/tv-first/RemoteCursorSmoke.java
          java -cp "$RUNNER_TEMP/nova-contract" PreviewGateSmoke
          java -cp "$RUNNER_TEMP/nova-contract" RemoteCursorSmoke
          changed="$(git diff --name-only c504379a49b170a1bbbffdfbd1634572c55ce821 HEAD)"
          ! grep -E 'android-tv/app/src/main/java/in/ghartv/nova/(Iptv|FlixMomo|FilmTor)' <<<"$changed"
  candidate:
    needs: [source, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'
      ANDROID_USER_HOME: /tmp/ghartv-review-test-android
      ANDROID_EMULATOR_HOME: /tmp/ghartv-review-test-android
      ANDROID_AVD_HOME: /tmp/ghartv-review-test-avd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Generate owned test media and compile exact release/tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghartv-candidate/proof android-tv/app/src/main/assets android-tv/app/src/debug/assets
          if ! command -v ffmpeg >/dev/null; then
            timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
            timeout 120 sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -t 30 -an -c:v libx264 -preset fast -crf 32 -pix_fmt yuv420p -movflags +faststart android-tv/app/src/main/assets/ghartv-native-check.mp4
          cp android-tv/app/src/main/assets/ghartv-native-check.mp4 android-tv/app/src/debug/assets/preview-fixture.mp4
          sha256sum android-tv/app/src/main/assets/ghartv-native-check.mp4 > /tmp/ghartv-candidate/proof/owned-native-media.sha256
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          (cd android-tv && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 assembleRelease assembleDebug assembleDebugAndroidTest)
          cp android-tv/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/ghartv-candidate/GharTV-code61-review-unsigned.apk
      - name: Observe public IPTV catalogue without changing or claiming playback
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess,time
          out=pathlib.Path('/tmp/ghartv-candidate/proof/iptv-org-playlist-probe.json')
          state={'schema':'ghartv.iptv-org-probe.v1','url':'https://iptv-org.github.io/iptv/index.m3u','observed_epoch_ms':int(time.time()*1000),'http_reachable':False,'m3u':False,'described_entries':0,'https_stream_lines':0,'live_channel_playback':'NOT_TESTED','implementation_changed':False}
          try:
            p=subprocess.run(['curl','-fL','--retry','2','--max-time','25','-sS',state['url']],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=35)
            state['curl_exit']=p.returncode
            if p.returncode==0:
              text=p.stdout.decode('utf-8','replace');state.update(http_reachable=True,bytes=len(p.stdout),m3u=text.startswith('#EXTM3U'),described_entries=sum(x.startswith('#EXTINF:') for x in text.splitlines()),https_stream_lines=sum(x.startswith('https://') for x in text.splitlines()))
            else:state['error']='bounded public playlist request failed'
          except Exception:state['error']='bounded public playlist request did not complete'
          out.write_text(json.dumps(state,indent=2)+'\n');print(json.dumps(state,indent=2))
          PY
      - name: Start isolated cloud Android 36 emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-36;google_apis;x86_64'
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          python - <<'PY'
          from pathlib import Path
          import os,subprocess,time,re
          out=Path('/tmp/ghartv-candidate/proof');sdk=Path(os.environ['ANDROID_HOME']);avd=Path(os.environ['ANDROID_AVD_HOME'])/'GHARTV_CLOUD_REVIEW_ONLY.avd'
          r=subprocess.run(['avdmanager','create','avd','--name','GHARTV_CLOUD_REVIEW_ONLY','--package','system-images;android-36;google_apis;x86_64','--path',str(avd)],input='no\n',capture_output=True,text=True,timeout=45);assert r.returncode==0,r.stdout+r.stderr
          cfg=avd/'config.ini';t=re.sub(r'^disk.dataPartition.size=.*$','disk.dataPartition.size=1G',cfg.read_text(),flags=re.M)
          if 'disk.dataPartition.size=' not in t:t+='\ndisk.dataPartition.size=1G\n'
          cfg.write_text(t)
          with (out/'test-emulator.log').open('w') as log:p=subprocess.Popen([str(sdk/'emulator/emulator'),'-avd','GHARTV_CLOUD_REVIEW_ONLY','-port','5580','-no-window','-no-audio','-no-snapshot','-no-boot-anim','-gpu','swiftshader','-feature','-Vulkan','-memory','2048'],stdin=subprocess.DEVNULL,stdout=log,stderr=log,start_new_session=True)
          end=time.monotonic()+180
          while time.monotonic()<end:
            if p.poll() is not None:raise RuntimeError('CLOUD_DEVICE_EXITED '+(out/'test-emulator.log').read_text()[-1500:])
            try:r=subprocess.run(['adb','-s','emulator-5580','shell','getprop','sys.boot_completed'],capture_output=True,text=True,timeout=5)
            except subprocess.TimeoutExpired:time.sleep(1);continue
            if r.returncode==0 and r.stdout.strip()=='1':break
            time.sleep(2)
          else:raise RuntimeError('CLOUD_DEVICE_TIMEOUT')
          for args in (['wm','size','1280x720'],['wm','density','160'],['settings','put','secure','immersive_mode_confirmations','confirmed'],['input','keyevent','KEYCODE_WAKEUP'],['wm','dismiss-keyguard']):subprocess.run(['adb','-s','emulator-5580','shell']+args,check=True)
          PY
      - name: Run deterministic Jio/IPTV/film regressions and observe unchanged live Tor smoke
        run: |
          set -euo pipefail
          RUNNER=in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          set +e
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.FilmTorNativeSmokeTest "$RUNNER" | tee /tmp/ghartv-candidate/proof/android-tor-native-smoke.txt
          tor_exit=${PIPESTATUS[0]}
          set -e
          TOR_EXIT="$tor_exit" python - <<'PY'
          import json,os,pathlib
          text=pathlib.Path('/tmp/ghartv-candidate/proof/android-tor-native-smoke.txt').read_text()
          result={'scope':'unchanged FlixMomo app-local Tor live smoke','exit_code':int(os.environ['TOR_EXIT']),'passed':'OK (1 test)' in text,'gating':False,'owner_live_acceptance':'ALREADY_REPORTED_WORKING_IN_REVIEW60'}
          pathlib.Path('/tmp/ghartv-candidate/proof/tor-smoke-observation.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.FilmCatalogueObservationTest "$RUNNER" | tee /tmp/ghartv-candidate/proof/android-catalogue-tests.txt
          grep -q 'OK (7 tests)' /tmp/ghartv-candidate/proof/android-catalogue-tests.txt
          for attempt in 1 2 3 4 5 6 7 8; do
            adb -s emulator-5580 shell am instrument -w -r -e class 'in.ghartv.nova.Review50FeedbackTest#realProviderFullscreenCallbackThenFDoesNotReloadOwnedVideo,in.ghartv.nova.Review47ViewingTest#explicitFullscreenActionEntersActualWebViewCustomMode' "$RUNNER" | tee "/tmp/ghartv-candidate/proof/android-fullscreen-repeat-${attempt}.txt"
            grep -q 'OK (2 tests)' "/tmp/ghartv-candidate/proof/android-fullscreen-repeat-${attempt}.txt"
          done
          FOCUSED=in.ghartv.nova.Review50FeedbackTest,in.ghartv.nova.Review51PointerSearchTest,in.ghartv.nova.Review47ViewingTest,in.ghartv.nova.Review52ProviderMigrationTest,in.ghartv.nova.PreviewControllerTest,in.ghartv.nova.Review53PreviewFailureTest,in.ghartv.nova.Review53ProviderRecoveryTest,in.ghartv.nova.FilmCatalogueObservationTest,in.ghartv.nova.FilmTorControllerTest,in.ghartv.nova.Review56SimplifiedDiscoverTest,in.ghartv.nova.Review58IptvAndDnsTest,in.ghartv.nova.Review59NetworkRecoveryTest,in.ghartv.nova.Review60JioBaselineAndIptvCacheTest,in.ghartv.nova.Review61JioDnsTest
          adb -s emulator-5580 shell am instrument -w -r -e class "$FOCUSED" "$RUNNER" | tee /tmp/ghartv-candidate/proof/android-focused-tests.txt
          grep -q 'OK (151 tests)' /tmp/ghartv-candidate/proof/android-focused-tests.txt
          FULL=in.ghartv.nova.RemoteWebCursorTest,in.ghartv.nova.FilmNativeControlsTest,in.ghartv.nova.DiscoverExperienceTest,in.ghartv.nova.Review38RegressionTest,in.ghartv.nova.Review39ExperienceTest,in.ghartv.nova.Review40PlaybackTest,in.ghartv.nova.Review41ConnectionTelemetryTest,in.ghartv.nova.Review42RegressionTest,in.ghartv.nova.Review43PerformanceTest,in.ghartv.nova.Review44LoadingMouseTest,in.ghartv.nova.Review45PlayEvidenceTest,in.ghartv.nova.Review46NativePointerTest,in.ghartv.nova.Review47ViewingTest,in.ghartv.nova.Review48InputStabilityTest,in.ghartv.nova.Review49PlaybackBudgetTest,in.ghartv.nova.Review50SeriesControlsTest,in.ghartv.nova.Review50FeedbackTest,in.ghartv.nova.Review51PointerSearchTest,in.ghartv.nova.Review52ProviderMigrationTest,in.ghartv.nova.PreviewControllerTest,in.ghartv.nova.Review53PreviewFailureTest,in.ghartv.nova.Review53ProviderRecoveryTest,in.ghartv.nova.FilmCatalogueObservationTest,in.ghartv.nova.FilmTorControllerTest,in.ghartv.nova.Review56SimplifiedDiscoverTest,in.ghartv.nova.Review58IptvAndDnsTest,in.ghartv.nova.Review59NetworkRecoveryTest,in.ghartv.nova.Review60JioBaselineAndIptvCacheTest,in.ghartv.nova.Review61JioDnsTest
          adb -s emulator-5580 shell am instrument -w -r -e class "$FULL" "$RUNNER" | tee /tmp/ghartv-candidate/proof/android-tests.txt
          grep -q 'OK (359 tests)' /tmp/ghartv-candidate/proof/android-tests.txt
          python - <<'PY'
          import json,pathlib
          pathlib.Path('/tmp/ghartv-candidate/proof/android-test-count.json').write_text(json.dumps({'deterministic_android_tests_passed':359,'focused_tests_passed':151,'external_tor_smoke_gating':False},indent=2)+'\n')
          PY
      - name: Package source-bound unsigned review artifact
        run: |
          set -euo pipefail
          git archive --format=zip HEAD -o /tmp/ghartv-candidate/GHARTV_CODE61_SOURCE.zip
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('/tmp/ghartv-candidate');apk=root/'GharTV-code61-review-unsigned.apk';source=root/'GHARTV_CODE61_SOURCE.zip';sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          gradle=pathlib.Path('android-tv/app/build.gradle.kts').read_text();assert 'versionCode = 61' in gradle and '0.6.0-rc15.2-jio-guide-dns-review' in gradle
          tor=json.loads((root/'proof/tor-smoke-observation.json').read_text())
          candidate={'schema':'ghartv.review61-candidate.v1','source':sha,'version_code':61,'version_name':'0.6.0-rc15.2-jio-guide-dns-review','package':'in.ghartv.nova','unsigned_apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'source_zip_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'deterministic_android_tests_passed':359,'focused_tests_passed':151,'external_tor_smoke_observed':tor,'iptv_implementation_changed':False,'flixmomo_implementation_changed':False,'jio_tor_enabled':False,'jio_api_dns':'system_first_tls_verified_secure_dns_on_failure','jio_media_preview':'direct_review38_compatible','live_jio_playback':'OWNER_REVIEW_REQUIRED','published':False}
          (root/'CANDIDATE.json').write_text(json.dumps(candidate,indent=2)+'\n')
          (root/'VALIDATION.json').write_text(json.dumps({'controlled_android_tests':'PASS','real_jio_guide_preview_watch_live':'NOT_VERIFIED','public_iptv_transport':'UNCHANGED_OWNER_CONFIRMED_WORKING','flixmomo':'UNCHANGED_OWNER_CONFIRMED_WORKING','iptv_logos':'existing_tvg_logo_loader_preserved','external_tor_smoke':'OBSERVED_NON_GATING_BECAUSE_IMPLEMENTATION_UNCHANGED'},indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          print(json.dumps(candidate,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-code61-owner-review
          path: /tmp/ghartv-candidate/
          retention-days: 14
