name: Nova TV experience contract
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['android-tv/**','TV_EXPERIENCE_CONTRACT.json','OWNER_REVIEW_REQUIREMENTS.json','tools/tv-first/**','tools/owner_review.command.in','tools/package_owner_review.py','.github/workflows/tv-experience-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghartv-tv-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: prepare
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  contract:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          python tools/tv-first/check_contract.py
          python tools/network_recovery_check.py
          python tools/tv-open/test_reopen.py
          python tools/tv-open/test_cold_start_dns.py
          python tools/provider-access/generate_android_players.py --check
          node --test tools/provider-access/player-options.test.mjs
          python tools/tv-first/test_review_clock.py
          python tools/tv-first/test_collect_review_interactions.py
          python tools/tv-first/test_tv_identity.py
          mkdir -p "$RUNNER_TEMP/ghartv-tor-policy"
          javac --release 8 -d "$RUNNER_TEMP/ghartv-tor-policy" android-tv/app/src/main/java/in/ghartv/nova/FilmTorFallback.java tools/tv-first/FilmTorFallbackCheck.java
          java -cp "$RUNNER_TEMP/ghartv-tor-policy" in.ghartv.nova.FilmTorFallbackCheck
          mkdir -p "$RUNNER_TEMP/nova-contract"
          javac -d "$RUNNER_TEMP/nova-contract" android-tv/app/src/main/java/in/ghartv/nova/PreviewGate.java tools/tv-first/PreviewGateSmoke.java android-tv/app/src/main/java/in/ghartv/nova/RemoteCursorState.java tools/tv-first/RemoteCursorSmoke.java
          java -cp "$RUNNER_TEMP/nova-contract" PreviewGateSmoke
          java -cp "$RUNNER_TEMP/nova-contract" RemoteCursorSmoke
  candidate:
    needs: [source, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'
      ANDROID_USER_HOME: /tmp/ghartv-review-test-android
      ANDROID_EMULATOR_HOME: /tmp/ghartv-review-test-android
      ANDROID_AVD_HOME: /tmp/ghartv-review-test-avd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Generate explicitly labelled owned native-engine test media
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghartv-candidate/proof android-tv/app/src/main/assets
          if ! command -v ffmpeg >/dev/null; then
            timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
            timeout 120 sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -t 30 -an -c:v libx264 -preset fast -crf 32 -pix_fmt yuv420p -movflags +faststart android-tv/app/src/main/assets/ghartv-native-check.mp4
          mkdir -p android-tv/app/src/debug/assets
          cp android-tv/app/src/main/assets/ghartv-native-check.mp4 android-tv/app/src/debug/assets/preview-fixture.mp4
          sha256sum android-tv/app/src/main/assets/ghartv-native-check.mp4 > /tmp/ghartv-candidate/proof/owned-native-media.sha256
      - name: Compile exact release and tests
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd android-tv
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleRelease assembleDebug assembleDebugAndroidTest
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/ghartv-candidate/GharTV-code56-review-unsigned.apk
      - name: Isolated cloud Android36, not an owner emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-36;google_apis;x86_64'
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          python - <<'PY'
          from pathlib import Path
          import os,subprocess,time,re
          out=Path('/tmp/ghartv-candidate/proof');sdk=Path(os.environ['ANDROID_HOME']);avd=Path(os.environ['ANDROID_AVD_HOME'])/'GHARTV_CLOUD_REVIEW_ONLY.avd'
          r=subprocess.run(['avdmanager','create','avd','--name','GHARTV_CLOUD_REVIEW_ONLY','--package','system-images;android-36;google_apis;x86_64','--path',str(avd)],input='no\n',capture_output=True,text=True,timeout=45)
          assert r.returncode==0,r.stdout+r.stderr
          cfg=avd/'config.ini';t=re.sub(r'^disk.dataPartition.size=.*$','disk.dataPartition.size=1G',cfg.read_text(),flags=re.M)
          if 'disk.dataPartition.size=' not in t:t+='\ndisk.dataPartition.size=1G\n'
          cfg.write_text(t)
          with (out/'test-emulator.log').open('w') as log:p=subprocess.Popen([str(sdk/'emulator/emulator'),'-avd','GHARTV_CLOUD_REVIEW_ONLY','-port','5580','-no-window','-no-audio','-no-snapshot','-no-boot-anim','-gpu','swiftshader','-feature','-Vulkan','-memory','2048'],stdin=subprocess.DEVNULL,stdout=log,stderr=log,start_new_session=True)
          end=time.monotonic()+180
          while time.monotonic()<end:
            if p.poll() is not None:raise RuntimeError('CLOUD_DEVICE_EXITED '+(out/'test-emulator.log').read_text()[-1500:])
            try:r=subprocess.run(['adb','-s','emulator-5580','shell','getprop','sys.boot_completed'],capture_output=True,text=True,timeout=5)
            except subprocess.TimeoutExpired:time.sleep(1);continue
            if r.returncode==0 and r.stdout.strip()=='1':break
            time.sleep(2)
          else:raise RuntimeError('CLOUD_DEVICE_TIMEOUT')
          for args in (['wm','size','1280x720'],['wm','density','160'],['settings','put','secure','immersive_mode_confirmations','confirmed'],['input','keyevent','KEYCODE_WAKEUP'],['wm','dismiss-keyguard']):subprocess.run(['adb','-s','emulator-5580','shell']+args,check=True)
          PY
      - name: Verify329 retained/new cases plus real app-local Tor smoke
        run: |
          set -euo pipefail
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.FilmTorNativeSmokeTest in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/ghartv-candidate/proof/android-tor-native-smoke.txt
          grep -q 'OK (1 test)' /tmp/ghartv-candidate/proof/android-tor-native-smoke.txt
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.FilmCatalogueObservationTest in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/ghartv-candidate/proof/android-catalogue-tests.txt
          grep -q 'OK (7 tests)' /tmp/ghartv-candidate/proof/android-catalogue-tests.txt
          # Repeated real fullscreen transitions must ALL pass; this is not retry-until-green.
          for attempt in 1 2 3 4 5 6 7 8; do
            adb -s emulator-5580 shell am instrument -w -r -e class 'in.ghartv.nova.Review50FeedbackTest#realProviderFullscreenCallbackThenFDoesNotReloadOwnedVideo,in.ghartv.nova.Review47ViewingTest#explicitFullscreenActionEntersActualWebViewCustomMode' in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee "/tmp/ghartv-candidate/proof/android-fullscreen-repeat-${attempt}.txt"
            grep -q 'OK (2 tests)' "/tmp/ghartv-candidate/proof/android-fullscreen-repeat-${attempt}.txt"
          done
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.Review50FeedbackTest,in.ghartv.nova.Review51PointerSearchTest,in.ghartv.nova.Review47ViewingTest,in.ghartv.nova.Review52ProviderMigrationTest,in.ghartv.nova.PreviewControllerTest,in.ghartv.nova.Review53PreviewFailureTest,in.ghartv.nova.Review53ProviderRecoveryTest,in.ghartv.nova.FilmCatalogueObservationTest,in.ghartv.nova.FilmTorControllerTest,in.ghartv.nova.Review56SimplifiedDiscoverTest in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/ghartv-candidate/proof/android-focused-tests.txt
          grep -q 'OK (121 tests)' /tmp/ghartv-candidate/proof/android-focused-tests.txt
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.RemoteWebCursorTest,in.ghartv.nova.FilmNativeControlsTest,in.ghartv.nova.DiscoverExperienceTest,in.ghartv.nova.Review38RegressionTest,in.ghartv.nova.Review39ExperienceTest,in.ghartv.nova.Review40PlaybackTest,in.ghartv.nova.Review41ConnectionTelemetryTest,in.ghartv.nova.Review42RegressionTest,in.ghartv.nova.Review43PerformanceTest,in.ghartv.nova.Review44LoadingMouseTest,in.ghartv.nova.Review45PlayEvidenceTest,in.ghartv.nova.Review46NativePointerTest,in.ghartv.nova.Review47ViewingTest,in.ghartv.nova.Review48InputStabilityTest,in.ghartv.nova.Review49PlaybackBudgetTest,in.ghartv.nova.Review50SeriesControlsTest,in.ghartv.nova.Review50FeedbackTest,in.ghartv.nova.Review51PointerSearchTest,in.ghartv.nova.Review52ProviderMigrationTest,in.ghartv.nova.PreviewControllerTest,in.ghartv.nova.Review53PreviewFailureTest,in.ghartv.nova.Review53ProviderRecoveryTest,in.ghartv.nova.FilmCatalogueObservationTest,in.ghartv.nova.FilmTorControllerTest,in.ghartv.nova.Review56SimplifiedDiscoverTest in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/ghartv-candidate/proof/android-tests.txt
          grep -q 'OK (329 tests)' /tmp/ghartv-candidate/proof/android-tests.txt
          for name in review47-owned-fullscreen.png review47-fullscreen-menu.png review47-toolbar-return.png; do adb -s emulator-5580 pull /sdcard/Android/data/in.ghartv.nova/files/$name /tmp/ghartv-candidate/proof/$name; done
      - name: Collect controlled timing observations
        run: |
          adb -s emulator-5580 pull /sdcard/Android/data/in.ghartv.nova/files/review49-timing.json /tmp/ghartv-candidate/proof/review49-timing.json
          adb -s emulator-5580 pull /sdcard/Android/data/in.ghartv.nova/files/review50-series-timing.json /tmp/ghartv-candidate/proof/review50-series-timing.json
      - name: Exact code56 release APK smoke and screenshots (CI emulator only)
        run: |
          set -euo pipefail
          OUT=/tmp/ghartv-candidate/proof/review56-release-ui
          mkdir -p "$OUT"
          APK=/tmp/ghartv-candidate/GharTV-code56-review-unsigned.apk
          SIGNED="$RUNNER_TEMP/ghartv-code56-ci-signed.apk"
          KS="$RUNNER_TEMP/ghartv-review56-smoke.keystore"
          PASS='Review56-CI-only-2026'
          export OUT APK SIGNED KS PASS
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, time, xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          status={"scope":"ephemeral CI Android 36 emulator; exact code56 release APK signed with a throwaway CI-only key","candidate_unsigned_apk_sha256":hashlib.sha256(pathlib.Path(os.environ["APK"]).read_bytes()).hexdigest(),"installed_package":"in.ghartv.nova","installed_version_code":None,"installed_version_name":None,"screenshots":[],"checks":{},"notes":[]}
          def run(args, timeout=30, check=True):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=timeout)
              if check and p.returncode: raise RuntimeError("exit=%s %s: %s"%(p.returncode,args[0],p.stdout[-1000:]))
              return p
          def adb(*args,timeout=30,check=True): return run(["adb","-s","emulator-5580",*args],timeout,check)
          def snap(name):
              q=subprocess.run(["adb","-s","emulator-5580","exec-out","screencap","-p"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=20)
              if q.returncode==0 and q.stdout.startswith(b"\x89PNG"):
                  (out/name).write_bytes(q.stdout);status["screenshots"].append({"file":name,"bytes":len(q.stdout)});return True
              status["notes"].append("screenshot capture failed: "+name+" "+q.stderr.decode("utf-8","replace")[-200:]);return False
          def hierarchy(label):
              adb("shell","uiautomator","dump","/sdcard/review56-window.xml",timeout=20,check=False)
              p=out/(label+".xml");q=adb("pull","/sdcard/review56-window.xml",str(p),timeout=15,check=False)
              if q.returncode or not p.exists(): status["notes"].append("UI hierarchy unavailable: "+label);return []
              try:
                  root=ET.parse(p).getroot();rows=[]
                  for n in root.iter("node"):
                      text=(n.attrib.get("text") or "").strip();desc=(n.attrib.get("content-desc") or "").strip()
                      if text or desc: rows.append({"text":text,"desc":desc,"bounds":n.attrib.get("bounds",""),"class":n.attrib.get("class","")})
                  return rows
              except Exception as e: status["notes"].append("UI hierarchy parse failed "+label+": "+str(e));return []
          def tap_node(rows,pred):
              for n in rows:
                  if pred(n):
                      m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.get("bounds",""))
                      if m:
                          x1,y1,x2,y2=map(int,m.groups());adb("shell","input","tap",str((x1+x2)//2),str((y1+y2)//2));time.sleep(1);return n
              return None
          try:
              run(["keytool","-genkeypair","-keystore",os.environ["KS"],"-storepass",os.environ["PASS"],"-keypass",os.environ["PASS"],"-alias","review56ci","-dname","CN=GharTV ephemeral CI smoke only","-keyalg","RSA","-keysize","2048","-validity","2","-noprompt"],timeout=30)
              apksigner=pathlib.Path(os.environ["ANDROID_HOME"])/"build-tools/36.0.0/apksigner"
              run([str(apksigner),"sign","--ks",os.environ["KS"],"--ks-key-alias","review56ci","--ks-pass","pass:"+os.environ["PASS"],"--key-pass","pass:"+os.environ["PASS"],"--out",os.environ["SIGNED"],os.environ["APK"]],timeout=30)
              run([str(apksigner),"verify","--verbose",os.environ["SIGNED"]],timeout=20)
              run(["adb","-s","emulator-5580","uninstall","in.ghartv.nova"],timeout=30,check=False)
              run(["adb","-s","emulator-5580","install",os.environ["SIGNED"]],timeout=60)
              pkg=adb("shell","dumpsys","package","in.ghartv.nova").stdout
              mcode=re.search(r"versionCode=(\\d+)",pkg)
              mname=re.search(r"versionName=([^\\s]+)",pkg)
              status["installed_package_metadata"]=[line.strip() for line in pkg.splitlines() if "versionCode=" in line or "versionName=" in line][:4]
              if mcode: status["installed_version_code"]=int(mcode.group(1))
              if mname: status["installed_version_name"]=mname.group(1)
              status["checks"]["exact_code56_release_installed"]=status["installed_version_code"]==56
              if not status["checks"]["exact_code56_release_installed"]: raise RuntimeError("installed package did not report versionCode 56")
              run(["adb","-s","emulator-5580","shell","monkey","-p","in.ghartv.nova","1"],timeout=20,check=False);time.sleep(10)
              snap("01-release-tv-guide.png");rows=hierarchy("01-release-tv-guide")
              status["checks"]["discover_visible_on_release_entry"]=any(n["text"]=="Discover" for n in rows)
              if not status["checks"]["discover_visible_on_release_entry"]:
                  status["notes"].append("Discover label was not exposed by accessibility hierarchy; guide screenshot retained.")
              else:
                  tap_node(rows,lambda n:n["text"]=="Discover");time.sleep(3);snap("02-release-discover-search.png");rows=hierarchy("02-release-discover-search")
                  status["checks"]["search_toolbar_visible"]=any(n["text"]=="Search" for n in rows) and any(n["text"]=="Back to TV guide" for n in rows)
                  edit=next((n for n in rows if n["class"].endswith("EditText") and n.get("bounds")),None)
                  if edit:
                      tap_node(rows,lambda n:n is edit);adb("shell","input","text","Paper%sLantern");time.sleep(1);rows=hierarchy("02a-query-entered")
                      tap_node(rows,lambda n:n["text"]=="Search");time.sleep(2);snap("03-release-search-submitted.png")
                      time.sleep(35);snap("04-release-search-after-35s.png");rows=hierarchy("04-release-search-after-35s")
                      texts=[n["text"] for n in rows if n["text"]]
                      status["checks"]["search_submitted"]=True
                      status["search_observation"]={"elapsed_after_submit_seconds":35,"visible_accessibility_texts":texts[:80],"catalogue_content_visible":any(any(k in t.lower() for k in ("trending movies","popular movies","search results","results for")) for t in texts),"error_or_loading_visible":any(any(k in t.lower() for k in ("could not","network error","timed out","no results","loading")) for t in texts)}
                      adb("shell","input","keyevent","KEYCODE_SEARCH");time.sleep(1);snap("05-release-search-toolbar-restored.png");rows=hierarchy("05-release-search-toolbar-restored")
                      status["checks"]["search_key_restores_toolbar"]=any(n["text"]=="Search" for n in rows)
                      adb("shell","input","keyevent","KEYCODE_MENU");time.sleep(1);rows=hierarchy("05a-options-menu")
                      route=tap_node(rows,lambda n:"FlixMomo route" in n["text"])
                      if route:
                          time.sleep(2);snap("06-release-route-status.png");rr=hierarchy("06-release-route-status")
                          status["checks"]["route_menu_opened"]=True;status["route_status_visible_text"]=[n["text"] for n in rr if n["text"]][:40]
                          adb("shell","input","keyevent","KEYCODE_BACK");time.sleep(1)
                      else: status["checks"]["route_menu_opened"]=False
                      adb("shell","input","keyevent","KEYCODE_MENU");time.sleep(1);rows=hierarchy("06a-options-menu")
                      back=tap_node(rows,lambda n:n["text"]=="Back to TV guide")
                      if back:
                          time.sleep(3);snap("07-release-return-to-guide.png");rr=hierarchy("07-release-return-to-guide")
                          status["checks"]["back_to_tv_guide_action_invoked"]=True
                          status["checks"]["discover_visible_after_return"]=any(n["text"]=="Discover" for n in rr)
                      else: status["checks"]["back_to_tv_guide_action_invoked"]=False
                  else:
                      status["checks"]["search_toolbar_visible"]=False
                      status["notes"].append("Search EditText not exposed; no search submitted.")
              status["status"]="OBSERVED"
          except Exception as e:
              status["status"]="BLOCKED_OR_FAILED";status["error"]=str(e)
          finally:
              (out/"status.json").write_text(json.dumps(status,indent=2)+"\n")
              print(json.dumps(status,indent=2))
          PY
      - name: Package same sign-and-open owner flow
        run: python tools/tv-first/package_review56.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-code56-owner-review
          path: /tmp/ghartv-candidate/
          retention-days: 14
