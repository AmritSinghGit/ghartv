name: Nova TV experience contract
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['android-tv/**','TV_EXPERIENCE_CONTRACT.json','OWNER_REVIEW_REQUIREMENTS.json','tools/tv-first/**','tools/owner_review.command.in','tools/package_owner_review.py','.github/workflows/tv-experience-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghartv-tv-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply the plain-text source patch with complete before-and-after hashes
        id: prepare
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          root=Path.cwd();parts=sorted(root.glob('tools/tv-first/review41.patch.*'))
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          if parts:
            assert len(parts)==4
            patch=''.join(p.read_text() for p in parts).encode()
            assert hashlib.sha256(patch).hexdigest()=='9674b6e8ccccc8323db99a80170052c70d90ddb50eaf6548328829d97ff0e0aa'
            manifest=root/'tools/tv-first/review41-files.json';records=json.loads(manifest.read_text());assert len(records)==11
            for item in records:
              name=item['path'];p=root/name
              assert not name.startswith('/') and '..' not in Path(name).parts and not p.is_symlink()
              assert name.startswith(('android-tv/','tools/tv-first/','tools/provider-access/')) or name=='REVIEW41.md'
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None)==item['before'],name+' changed; preserved'
            with tempfile.NamedTemporaryFile() as f:
              f.write(patch);f.flush();subprocess.run(['git','apply','--check','--unidiff-zero',f.name],check=True)
              subprocess.run(['git','apply','--unidiff-zero',f.name],check=True)
            for item in records:assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['after'],item['path']
            subprocess.run(['python','tools/tv-first/check_contract.py'],check=True)
            assert git('ls-remote','origin','refs/heads/codex/ghartv-remove-auto-preview').split()[0]==os.environ['GITHUB_SHA'],'Concurrent work preserved'
            paths=[i['path'] for i in records]+[str(p.relative_to(root)) for p in parts]+[str(manifest.relative_to(root))]
            for p in parts:p.unlink()
            manifest.unlink()
            subprocess.run(['git','add','--',*paths],check=True)
            assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
            subprocess.run(['git','config','user.name','GharTV verified source expansion'],check=True)
            subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
            subprocess.run(['git','commit','-m','fix(ghartv): Review41 scoped TLS cancellation and consented diagnostic delivery'],check=True)
            subprocess.run(['git','push','origin','HEAD:refs/heads/codex/ghartv-remove-auto-preview'],check=True)
          source=git('rev-parse','HEAD')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source_sha='+source+'\n')
          print('EXACT_APPLICATION_SOURCE='+source)
          PY
  contract:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          python tools/tv-first/check_contract.py
          python tools/provider-access/generate_android_players.py --check
          node --test tools/provider-access/player-options.test.mjs
          mkdir -p "$RUNNER_TEMP/nova-contract"
          javac -d "$RUNNER_TEMP/nova-contract" android-tv/app/src/main/java/in/ghartv/nova/PreviewGate.java tools/tv-first/PreviewGateSmoke.java android-tv/app/src/main/java/in/ghartv/nova/RemoteCursorState.java tools/tv-first/RemoteCursorSmoke.java
          java -cp "$RUNNER_TEMP/nova-contract" PreviewGateSmoke
          java -cp "$RUNNER_TEMP/nova-contract" RemoteCursorSmoke
  candidate:
    needs: [source, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'
      ANDROID_USER_HOME: /tmp/ghartv-review-test-android
      ANDROID_EMULATOR_HOME: /tmp/ghartv-review-test-android
      ANDROID_AVD_HOME: /tmp/ghartv-review-test-avd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Read-only fixed-host TLS and collector health observation
        run: |
          mkdir -p /tmp/ghartv-candidate/proof
          python tools/provider-access/observe_connection.py /tmp/ghartv-candidate/proof/cloud-connection.json
      - name: Compile exact release and tests
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd android-tv
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleRelease assembleDebug assembleDebugAndroidTest
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/ghartv-candidate/GharTV-code41-review-unsigned.apk
      - name: Isolated Android36 test device, not the owner runtime
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libasound2t64 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libegl1 libglu1-mesa
          sdkmanager 'emulator' 'system-images;android-36;google_apis;x86_64'
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          python - <<'PY'
          from pathlib import Path
          import os,subprocess,time,re
          out=Path('/tmp/ghartv-candidate/proof');sdk=Path(os.environ['ANDROID_HOME']);avd=Path(os.environ['ANDROID_AVD_HOME'])/'GHARTV_CLOUD_REVIEW_ONLY.avd'
          result=subprocess.run(['avdmanager','create','avd','--name','GHARTV_CLOUD_REVIEW_ONLY','--package','system-images;android-36;google_apis;x86_64','--path',str(avd)],input='no\n',capture_output=True,text=True,timeout=45)
          assert result.returncode==0,result.stdout+result.stderr
          config=avd/'config.ini';text=re.sub(r'^disk.dataPartition.size=.*$','disk.dataPartition.size=1G',config.read_text(),flags=re.M)
          if 'disk.dataPartition.size=' not in text:text+='\ndisk.dataPartition.size=1G\n'
          config.write_text(text)
          with (out/'test-emulator.log').open('w') as log:proc=subprocess.Popen([str(sdk/'emulator/emulator'),'-avd','GHARTV_CLOUD_REVIEW_ONLY','-port','5580','-no-window','-no-audio','-no-snapshot','-no-boot-anim','-gpu','swiftshader','-feature','-Vulkan','-memory','2048'],stdin=subprocess.DEVNULL,stdout=log,stderr=log,start_new_session=True)
          deadline=time.monotonic()+180
          while time.monotonic()<deadline:
            if proc.poll() is not None:raise RuntimeError('CLOUD_DEVICE_EXITED '+(out/'test-emulator.log').read_text()[-1500:])
            try:result=subprocess.run(['adb','-s','emulator-5580','shell','getprop','sys.boot_completed'],capture_output=True,text=True,timeout=5)
            except subprocess.TimeoutExpired:time.sleep(1);continue
            if result.returncode==0 and result.stdout.strip()=='1':break
            time.sleep(2)
          else:raise RuntimeError('CLOUD_DEVICE_TIMEOUT')
          for args in (['wm','size','1280x720'],['wm','density','160'],['settings','put','secure','immersive_mode_confirmations','confirmed'],['input','keyevent','KEYCODE_WAKEUP'],['wm','dismiss-keyguard']):subprocess.run(['adb','-s','emulator-5580','shell']+args,check=True)
          PY
      - name: Retained playback acceptance and new TLS consent queue delivery cases
        run: |
          set -euo pipefail
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb -s emulator-5580 shell am instrument -w -r -e class in.ghartv.nova.RemoteWebCursorTest,in.ghartv.nova.FilmNativeControlsTest,in.ghartv.nova.DiscoverExperienceTest,in.ghartv.nova.Review38RegressionTest,in.ghartv.nova.Review39ExperienceTest,in.ghartv.nova.Review40PlaybackTest,in.ghartv.nova.Review41ConnectionTelemetryTest in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/ghartv-candidate/proof/android-tests.txt
          grep -q 'OK (88 tests)' /tmp/ghartv-candidate/proof/android-tests.txt
          adb -s emulator-5580 pull /sdcard/Android/data/in.ghartv.nova/files/review40-owned-playback-fixture.png /tmp/ghartv-candidate/proof/retained-owned-playback.png
      - name: Package compiled41 with the unchanged original signing and runtime flow
        run: python tools/tv-first/package_review41.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-code41-owner-review
          path: /tmp/ghartv-candidate/
          retention-days: 14
