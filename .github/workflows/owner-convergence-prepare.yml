name: Prepare GharTV owner convergence
on:
  push:
    paths: ['.github/workflows/owner-convergence-prepare.yml']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: codex/ghartv-remove-auto-preview
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Materialize bounded source changes from verified delivery capsule
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          raw=base64.b64decode(''.join(Path('.owner-prep/part'+str(i)).read_text() for i in range(6)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='168e7631931174c55dad4aa096fc32281bffd05cd95f69ffd9fd508c96178e17'
          items=json.loads(lzma.decompress(raw))
          assert len(items)<=30
          for name,text in items.items():
            p=Path(name)
            assert not p.is_absolute() and '..' not in p.parts and len(text)<150000
            assert name.startswith(('android-tv/','docs/','web-player/','tools/')) or name in ('CURRENT_HANDOFF.md','GHARTV_LANE_PROGRESS.md','REVIEW_060_RC4.md')
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          print('CAPSULE_FILES_VERIFIED='+str(len(items)))
          PY
          python tools/apply_owner_convergence.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/package_owner_review.py');s=p.read_text();s=s.replace("if str(p)!='web-player/node_modules/hls.js/dist/hls.min.js':continue", "if str(p) not in ('web-player/node_modules/hls.js/dist/hls.min.js','web-player/node_modules/hls.js/LICENSE'):continue");p.write_text(s)
          PY
      - name: Focused source and real SQLite command-flow validation
        run: |
          bash VALIDATE_SOURCE.command
          node --check web-player/server.mjs
          node --check web-player/owner-gateway.mjs
          node --check web-player/public/app.js
          node tools/owner-convergence-check.mjs
      - name: Compile the real Android release without signing material
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd android-tv
          bash gradlew --no-daemon --max-workers=2 :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | head -n 1
      - name: Prepare the existing browser-player dependency
        working-directory: web-player
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish checked source on the SAME branch, no production change
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git rm -r .owner-prep .github/workflows/owner-convergence-prepare.yml
          rm tools/apply_owner_convergence.py tools/worker_additions.js tools/owner_additions.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-tv/app/src android-tv/app/build.gradle.kts VALIDATE_SOURCE.command docs web-player/server.mjs web-player/owner-gateway.mjs web-player/public/app.js tools/owner_review.command.in tools/package_owner_review.py tools/owner-convergence-check.mjs CURRENT_HANDOFF.md GHARTV_LANE_PROGRESS.md REVIEW_060_RC4.md
          test -z "$(git diff --name-only --cached -- update/latest.json)"
          git commit -m 'feat: owner convergence RC4 with IST, birthday editing, broadcast receipts and artifact-first review'
          git push origin HEAD:refs/heads/$BRANCH
          echo "APPLICATION_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Publish exact unsigned APK, companion and runnable owner delivery
        run: |
          set -euo pipefail
          python tools/package_owner_review.py
          gh release create v0.6.0-rc4 /tmp/ghartv-owner-candidate/* --repo AmritSinghGit/ghartv --target "$(git rev-parse HEAD)" --prerelease --title 'GharTV 0.6.0 RC4 — owner convergence review' --notes-file REVIEW_060_RC4.md
          echo 'REVIEW_RELEASE_PUBLISHED=YES; OWNER_SIGNING_AND_EXECUTION=NOT_PERFORMED; PRODUCTION_UNCHANGED=YES'
