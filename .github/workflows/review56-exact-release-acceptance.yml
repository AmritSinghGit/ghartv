name: Review56 exact release acceptance
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/review56-exact-release-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_USER_HOME: /tmp/ghartv-review56-release-android
      ANDROID_EMULATOR_HOME: /tmp/ghartv-review56-release-android
      ANDROID_AVD_HOME: /tmp/ghartv-review56-release-avd
      ARTIFACT_ID: '12123248057'
      ARTIFACT_SHA256: '2f816aeb028e93fdb4217f991f5859caddfa5b3186844d04541ea636853799d7'
      APK_SHA256: 'b77a2b9faa262904ee4168bb7888b8f368f026446d735df77c6c19e63b5848e3'
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download and verify the already-built Review56 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/review56-artifact /tmp/review56-evidence
          curl -fL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/review56-artifact.zip
          echo "$ARTIFACT_SHA256  /tmp/review56-artifact.zip" | sha256sum -c -
          unzip -q /tmp/review56-artifact.zip -d /tmp/review56-artifact
          echo "$APK_SHA256  /tmp/review56-artifact/GharTV-code56-review-unsigned.apk" | sha256sum -c -
          cp /tmp/review56-artifact/CANDIDATE.json /tmp/review56-evidence/
          cp /tmp/review56-artifact/VALIDATION.json /tmp/review56-evidence/
          cp /tmp/review56-artifact/SHA256SUMS /tmp/review56-evidence/
      - name: Start isolated official Android 36 emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --name GHARTV_R56_EXACT_RELEASE --package 'system-images;android-36;google_apis;x86_64' --path "$ANDROID_AVD_HOME/GHARTV_R56_EXACT_RELEASE.avd"
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, time
          out=Path('/tmp/review56-evidence');sdk=Path(os.environ['ANDROID_HOME'])
          log=(out/'emulator.log').open('w')
          p=subprocess.Popen([str(sdk/'emulator/emulator'),'-avd','GHARTV_R56_EXACT_RELEASE','-port','5580','-no-window','-no-audio','-no-snapshot','-no-boot-anim','-gpu','swiftshader','-feature','-Vulkan','-memory','2048'],stdin=subprocess.DEVNULL,stdout=log,stderr=log,start_new_session=True)
          end=time.monotonic()+180
          while time.monotonic()<end:
              if p.poll() is not None: raise RuntimeError('emulator exited: '+(out/'emulator.log').read_text()[-1800:])
              try: r=subprocess.run(['adb','-s','emulator-5580','shell','getprop','sys.boot_completed'],capture_output=True,text=True,timeout=5)
              except subprocess.TimeoutExpired: time.sleep(1); continue
              if r.returncode==0 and r.stdout.strip()=='1': break
              time.sleep(2)
          else: raise RuntimeError('emulator boot timeout')
          for args in (['wm','size','1280x720'],['wm','density','160'],['settings','put','secure','immersive_mode_confirmations','confirmed'],['input','keyevent','KEYCODE_WAKEUP'],['wm','dismiss-keyguard']):
              subprocess.run(['adb','-s','emulator-5580','shell']+args,check=True)
          PY
      - name: Install exact release APK and capture production film-browser behavior
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, time, xml.etree.ElementTree as ET
          out=pathlib.Path('/tmp/review56-evidence')
          apk=pathlib.Path('/tmp/review56-artifact/GharTV-code56-review-unsigned.apk')
          signed=pathlib.Path('/tmp/ghartv-code56-ci-signed.apk')
          ks=pathlib.Path('/tmp/ghartv-review56-ci-only.keystore')
          password='Review56-CI-only-2026'
          status={
            'schema':'ghartv.review56.exact-release-acceptance.v1',
            'scope':'isolated official Android 36 CI emulator; no owner device, credentials or data',
            'source_application_sha':'2447b944a44ed8757b04e4e9d165533d652245fe',
            'verification_workflow_sha':'a177968c625098f32e1b41c792c2775758312157',
            'candidate_unsigned_apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'expected_unsigned_apk_sha256':os.environ['APK_SHA256'],
            'installed_package':'in.ghartv.nova',
            'installed_version_code':None,
            'installed_version_name':None,
            'launch_attempts':[],
            'screenshots':[],
            'checks':{},
            'notes':[],
            'live_provider':{'catalogue_verified':False,'video_first_frame_verified':False,'reason':'not attempted yet'}
          }
          def run(args,timeout=30,check=True,binary=False):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=not binary,timeout=timeout)
              if check and p.returncode:
                  tail=p.stdout[-1400:] if not binary else p.stdout[-1400:].decode('utf-8','replace')
                  raise RuntimeError('exit=%s command=%s output=%s'%(p.returncode,args[0],tail))
              return p
          def adb(*args,timeout=30,check=True): return run(['adb','-s','emulator-5580',*args],timeout,check)
          def screenshot(name):
              p=run(['adb','-s','emulator-5580','exec-out','screencap','-p'],timeout=20,check=False,binary=True)
              path=out/name
              if p.returncode==0 and p.stdout.startswith(b'\x89PNG'):
                  path.write_bytes(p.stdout);status['screenshots'].append({'file':name,'bytes':len(p.stdout)});return True
              status['notes'].append('screenshot failed: '+name);return False
          def hierarchy(label):
              adb('shell','uiautomator','dump','/sdcard/review56-window.xml',timeout=20,check=False)
              path=out/(label+'.xml')
              q=adb('pull','/sdcard/review56-window.xml',str(path),timeout=15,check=False)
              if q.returncode or not path.exists(): status['notes'].append('UI hierarchy unavailable: '+label);return []
              try:
                  root=ET.parse(path).getroot();rows=[]
                  for n in root.iter('node'):
                      text=(n.attrib.get('text') or '').strip();desc=(n.attrib.get('content-desc') or '').strip()
                      if text or desc: rows.append({'text':text,'desc':desc,'bounds':n.attrib.get('bounds',''),'class':n.attrib.get('class','')})
                  return rows
              except Exception as e: status['notes'].append('UI hierarchy parse failed '+label+': '+str(e));return []
          def tap(rows,predicate):
              for n in rows:
                  if predicate(n):
                      m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.get('bounds',''))
                      if m:
                          x1,y1,x2,y2=map(int,m.groups());adb('shell','input','tap',str((x1+x2)//2),str((y1+y2)//2));time.sleep(1);return n
              return None
          try:
              if status['candidate_unsigned_apk_sha256']!=status['expected_unsigned_apk_sha256']: raise RuntimeError('unsigned APK checksum mismatch')
              run(['keytool','-genkeypair','-keystore',str(ks),'-storepass',password,'-keypass',password,'-alias','review56ci','-dname','CN=GharTV ephemeral CI acceptance only','-keyalg','RSA','-keysize','2048','-validity','2','-noprompt'])
              apksigner=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0/apksigner'
              run([str(apksigner),'sign','--ks',str(ks),'--ks-key-alias','review56ci','--ks-pass','pass:'+password,'--key-pass','pass:'+password,'--out',str(signed),str(apk)])
              run([str(apksigner),'verify','--verbose',str(signed)])
              adb('uninstall','in.ghartv.nova',timeout=30,check=False)
              adb('install',str(signed),timeout=60)
              pkg=adb('shell','dumpsys','package','in.ghartv.nova').stdout
              vc=re.search(r'versionCode=(\d+)',pkg);vn=re.search(r'versionName=([^\s]+)',pkg)
              status['installed_version_code']=int(vc.group(1)) if vc else None
              status['installed_version_name']=vn.group(1) if vn else None
              status['checks']['exact_code56_release_installed']=status['installed_version_code']==56 and status['installed_version_name']=='0.6.0-rc14.7-search-tor-browser-review'
              if not status['checks']['exact_code56_release_installed']: raise RuntimeError('installed package identity mismatch')

              root_result=adb('root',timeout=20,check=False);status['launch_attempts'].append({'action':'adb root','exit':root_result.returncode,'output':root_result.stdout[-500:]})
              time.sleep(2);adb('wait-for-device',timeout=30,check=False)
              launch=adb('shell','am','start','-W','-n','in.ghartv.nova/.FlixMomoActivity',timeout=30,check=False)
              status['launch_attempts'].append({'action':'start production FlixMomoActivity','exit':launch.returncode,'output':launch.stdout[-1200:]})
              if launch.returncode!=0 or 'Error:' in launch.stdout or 'SecurityException' in launch.stdout:
                  fallback=adb('shell','monkey','-p','in.ghartv.nova','1',timeout=20,check=False)
                  status['launch_attempts'].append({'action':'launch public app entrypoint','exit':fallback.returncode,'output':fallback.stdout[-800:]})
                  time.sleep(5);screenshot('01-public-entrypoint.png');rows=hierarchy('01-public-entrypoint')
                  status['checks']['production_film_activity_launched']=False
                  status['public_entrypoint_visible_text']=[n['text'] for n in rows if n['text']][:80]
                  status['notes'].append('Fresh release has no Jio credentials; public MainActivity correctly routes to login. Non-exported film activity could not be launched by shell, so exact release film UI was not directly exercisable without an instrumentation bridge.')
              else:
                  status['checks']['production_film_activity_launched']=True
                  time.sleep(8);screenshot('01-production-discover-search.png');rows=hierarchy('01-production-discover-search')
                  texts=[n['text'] for n in rows if n['text']]
                  status['checks']['search_toolbar_visible']=('Search' in texts and 'Back to TV guide' in texts)
                  status['initial_visible_text']=texts[:80]
                  edit=next((n for n in rows if n['class'].endswith('EditText') and n.get('bounds')),None)
                  if edit and tap(rows,lambda n:n is edit):
                      adb('shell','input','text','Paper%sLantern');time.sleep(1);rows=hierarchy('02-query-entered')
                      search=tap(rows,lambda n:n['text']=='Search')
                      status['checks']['search_submitted']=bool(search)
                      time.sleep(2);screenshot('02-search-submitted.png')
                      time.sleep(75);screenshot('03-search-after-75s.png');rows=hierarchy('03-search-after-75s')
                      visible=[n['text'] for n in rows if n['text']]
                      status['provider_observation']={'elapsed_seconds':75,'visible_text':visible[:120]}
                      status['live_provider']['catalogue_verified']=any(any(k in t.lower() for k in ('results for','trending movies','popular movies')) for t in visible) and not any('could not' in t.lower() for t in visible)
                      status['live_provider']['reason']='visible provider catalogue text observed' if status['live_provider']['catalogue_verified'] else 'no trustworthy catalogue-result proof in accessibility output/screenshots'
                      adb('shell','input','keyevent','KEYCODE_SEARCH');time.sleep(1);screenshot('04-search-toolbar-restored.png');rows=hierarchy('04-search-toolbar-restored')
                      status['checks']['search_key_restores_toolbar']=any(n['text']=='Search' for n in rows)
                      adb('shell','input','keyevent','KEYCODE_MENU');time.sleep(1);rows=hierarchy('05-menu')
                      route=tap(rows,lambda n:'FlixMomo route' in n['text'])
                      if route:
                          time.sleep(2);screenshot('05-route-status.png');rr=hierarchy('05-route-status')
                          status['checks']['route_status_opened']=True;status['route_visible_text']=[n['text'] for n in rr if n['text']][:80]
                          adb('shell','input','keyevent','KEYCODE_BACK');time.sleep(1)
                      else: status['checks']['route_status_opened']=False
                      adb('shell','input','keyevent','KEYCODE_MENU');time.sleep(1);rows=hierarchy('06-menu-return')
                      back=tap(rows,lambda n:n['text']=='Back to TV guide')
                      status['checks']['back_to_guide_action_invoked']=bool(back)
                      if back: time.sleep(3);screenshot('06-after-back-to-guide.png')
                  else:
                      status['checks']['search_toolbar_visible']=False;status['notes'].append('Search EditText not exposed by production hierarchy.')
              status['status']='OBSERVED'
          except Exception as e:
              status['status']='BLOCKED_OR_FAILED';status['error']=str(e)
          finally:
              (out/'status.json').write_text(json.dumps(status,indent=2)+'\n')
              print(json.dumps(status,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-review56-exact-release-acceptance
          path: /tmp/review56-evidence/
          retention-days: 14
