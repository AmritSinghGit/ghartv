# Review63: Jio timeouts, previews and the Discover pointer. Built + tested here; installed by tools/tv-first/install_candidate.py.
name: GharTV Review63 candidate
on:
  push:
    branches: ['codex/ghartv-remove-auto-preview']
    paths: ['.github/workflows/review63-candidate.yml','android-tv/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghartv-review63-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'
      ANDROID_USER_HOME: /tmp/ghartv-r63-android
      ANDROID_EMULATOR_HOME: /tmp/ghartv-r63-android
      ANDROID_AVD_HOME: /tmp/ghartv-r63-avd
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Source contract and exact build
        run: |
          set -euo pipefail
          python tools/tv-first/check_contract.py
          test "$(git diff --name-only 53032e67fd9c1e11ae8c466ba90289d41faa5bc2 HEAD | grep -Ec '^android-tv/app/src/main/java/in/ghartv/nova/(Iptv|FilmTor)')" = 0
          mkdir -p /tmp/nova-contract && javac -d /tmp/nova-contract android-tv/app/src/main/java/in/ghartv/nova/PreviewGate.java tools/tv-first/PreviewGateSmoke.java android-tv/app/src/main/java/in/ghartv/nova/RemoteCursorState.java tools/tv-first/RemoteCursorSmoke.java
          java -cp /tmp/nova-contract PreviewGateSmoke
          java -cp /tmp/nova-contract RemoteCursorSmoke
          mkdir -p /tmp/ghartv-review63/proof android-tv/app/src/main/assets android-tv/app/src/debug/assets
          if ! command -v ffmpeg >/dev/null; then
            timeout 90 sudo apt-get -o Acquire::Retries=1 update -qq
            timeout 120 sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -t 30 -an -c:v libx264 -preset fast -crf 32 -pix_fmt yuv420p -movflags +faststart android-tv/app/src/main/assets/ghartv-native-check.mp4
          cp android-tv/app/src/main/assets/ghartv-native-check.mp4 android-tv/app/src/debug/assets/preview-fixture.mp4
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          (cd android-tv && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 assembleRelease assembleDebug assembleDebugAndroidTest)
          cp android-tv/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/ghartv-review63/GharTV-code63-review-unsigned.apk
      - name: Isolated Android 36 emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-36;google_apis;x86_64'
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name GHARTV_R63_CI --package 'system-images;android-36;google_apis;x86_64' --path "$ANDROID_AVD_HOME/GHARTV_R63_CI.avd"
          echo 'disk.dataPartition.size=1G' >> "$ANDROID_AVD_HOME/GHARTV_R63_CI.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd GHARTV_R63_CI -port 5580 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan -memory 2048 > /tmp/ghartv-review63/proof/emulator.log 2>&1 &
          for n in $(seq 1 150); do  # cold CI emulators sometimes need >3 min
            test "$(adb -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 && break
            sleep 2
          done
          if [ "$(adb -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]; then
            echo '::error::CI emulator did not boot (infrastructure, not app code). Emulator log tail:'
            tail -120 /tmp/ghartv-review63/proof/emulator.log || true
            adb devices -l || true
            exit 1
          fi
          adb -s emulator-5580 shell wm size 1280x720
          adb -s emulator-5580 shell wm density 160
      - name: Run focused and complete deterministic suites
        run: |
          set -euo pipefail
          RUNNER=in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5580 install -r android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          FOCUSED=in.ghartv.nova.Review50FeedbackTest,in.ghartv.nova.Review51PointerSearchTest,in.ghartv.nova.Review47ViewingTest,in.ghartv.nova.Review52ProviderMigrationTest,in.ghartv.nova.PreviewControllerTest,in.ghartv.nova.Review53PreviewFailureTest,in.ghartv.nova.Review53ProviderRecoveryTest,in.ghartv.nova.FilmCatalogueObservationTest,in.ghartv.nova.FilmTorControllerTest,in.ghartv.nova.Review56SimplifiedDiscoverTest,in.ghartv.nova.Review58IptvAndDnsTest,in.ghartv.nova.Review59NetworkRecoveryTest,in.ghartv.nova.Review60JioBaselineAndIptvCacheTest,in.ghartv.nova.Review61JioDnsTest,in.ghartv.nova.Review63JioMediaDnsDiagnosticsTest
          adb -s emulator-5580 shell am instrument -w -r -e class "$FOCUSED" "$RUNNER" | tee /tmp/ghartv-review63/proof/focused.txt
          grep -q 'OK (155 tests)' /tmp/ghartv-review63/proof/focused.txt
          FULL=in.ghartv.nova.RemoteWebCursorTest,in.ghartv.nova.FilmNativeControlsTest,in.ghartv.nova.DiscoverExperienceTest,in.ghartv.nova.Review38RegressionTest,in.ghartv.nova.Review39ExperienceTest,in.ghartv.nova.Review40PlaybackTest,in.ghartv.nova.Review41ConnectionTelemetryTest,in.ghartv.nova.Review42RegressionTest,in.ghartv.nova.Review43PerformanceTest,in.ghartv.nova.Review44LoadingMouseTest,in.ghartv.nova.Review45PlayEvidenceTest,in.ghartv.nova.Review46NativePointerTest,in.ghartv.nova.Review47ViewingTest,in.ghartv.nova.Review48InputStabilityTest,in.ghartv.nova.Review49PlaybackBudgetTest,in.ghartv.nova.Review50SeriesControlsTest,in.ghartv.nova.Review50FeedbackTest,in.ghartv.nova.Review51PointerSearchTest,in.ghartv.nova.Review52ProviderMigrationTest,in.ghartv.nova.PreviewControllerTest,in.ghartv.nova.Review53PreviewFailureTest,in.ghartv.nova.Review53ProviderRecoveryTest,in.ghartv.nova.FilmCatalogueObservationTest,in.ghartv.nova.FilmTorControllerTest,in.ghartv.nova.Review56SimplifiedDiscoverTest,in.ghartv.nova.Review58IptvAndDnsTest,in.ghartv.nova.Review59NetworkRecoveryTest,in.ghartv.nova.Review60JioBaselineAndIptvCacheTest,in.ghartv.nova.Review61JioDnsTest,in.ghartv.nova.Review63JioMediaDnsDiagnosticsTest
          adb -s emulator-5580 shell am instrument -w -r -e class "$FULL" "$RUNNER" | tee /tmp/ghartv-review63/proof/full.txt
          grep -q 'OK (363 tests)' /tmp/ghartv-review63/proof/full.txt
      - name: Package source-bound evidence
        run: |
          set -euo pipefail
          git archive --format=zip HEAD -o /tmp/ghartv-review63/GHARTV_CODE63_SOURCE.zip
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('/tmp/ghartv-review63'); apk=root/'GharTV-code63-review-unsigned.apk'; src=root/'GHARTV_CODE63_SOURCE.zip'
          data={'schema':'ghartv.review63-candidate.v1','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'version_code':63,'version_name':'0.6.0-rc15.4-jio-timeouts-pointer-review','package':'in.ghartv.nova','unsigned_apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'source_zip_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),'focused_tests_passed':155,'deterministic_tests_passed':363,'jio_tor':False,'iptv_changed':False,'flixmomo_changed':'pointer_ui_only','live_jio_acceptance':'OWNER_REQUIRED','published':False}
          (root/'CANDIDATE.json').write_text(json.dumps(data,indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          print(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true  # artifact quota must not hide a green test run; the installer can build locally
        with:
          name: ghartv-code63-owner-review
          path: /tmp/ghartv-review63/
          retention-days: 14
