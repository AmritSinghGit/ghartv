name: GharTV GREEN review build
on:
  push:
    paths: ['.github/workflows/green-review-build.yml']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: codex/ghartv-remove-auto-preview
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Apply verified repair and release-desk source to the existing branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          raw=base64.b64decode(''.join(Path('.green-prep/part'+str(i)).read_text() for i in range(9)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='bb8c7f1bdc968e5f66134bb438c4c11171db5af823b910117078eabdbd8febf4'
          data=json.loads(lzma.decompress(raw));assert len(data['targets'])==40 and len(data['patch'])<500000
          for name,expected in data['base'].items():
            p=Path(name);assert not p.is_absolute() and '..' not in p.parts
            assert name.startswith(('android-tv/','web-player/','docs/','tools/')) or name in ('AGENTS.md','CURRENT_HANDOFF.md','GHARTV_LANE_PROGRESS.md','OWNER_REVIEW_REQUIREMENTS.json','REVIEW_060_RC7.md','REVIEW_CANDIDATE.json','VALIDATE_SOURCE.command')
            if expected is None:assert not p.exists(),name
            else:assert hashlib.sha256(p.read_bytes()).hexdigest()==expected,name
          patch=Path('/tmp/ghartv-green-repair.diff');patch.write_text(data['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,expected in data['targets'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          Path('/tmp/ghartv-green-targets.json').write_text(json.dumps(list(data['targets'])))
          print('VERIFIED_SOURCE_PATCH=40_FILES')
          PY
      - name: Focused network, manual reporting, release and continuity checks
        run: |
          set -euo pipefail
          bash VALIDATE_SOURCE.command
          mkdir -p /tmp/ghartv-jvm-check
          javac -d /tmp/ghartv-jvm-check android-tv/app/src/main/java/in/ghartv/nova/{FamilyMemberRules,GuideTimeline,UpdatePolicy,NetworkFailure}.java tools/{FamilyRulesSmoke,GuideRulesSmoke,UpdatePolicySmoke,NetworkRulesSmoke}.java
          for rule in FamilyRulesSmoke GuideRulesSmoke UpdatePolicySmoke NetworkRulesSmoke; do java -cp /tmp/ghartv-jvm-check "$rule"; done
          python tools/network_recovery_check.py
          python tools/release_gate_check.py
          node tools/support-report-check.mjs
          node tools/rc6_receipt_check.mjs
          node --check web-player/release-desk.mjs
          node --check web-player/owner-gateway.mjs
          node --check web-player/server.mjs
          # Worker source is unchanged. The legacy owner-convergence script requires
          # the obsolete summary-only UI. Current explicit summary+sample behaviour
          # and absence of automatic reads are verified in rc7_browser_check below.
      - name: Compile the actual Android release
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd android-tv
          bash gradlew --no-daemon --max-workers=2 :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/ghartv-green-badging.txt
          python - <<'PY'
          from pathlib import Path
          first=Path('/tmp/ghartv-green-badging.txt').read_text().splitlines()[0]
          assert "name='in.ghartv.nova'" in first and "versionCode='23'" in first and "versionName='0.6.0-rc7-network-diagnostics'" in first
          print(first)
          PY
      - name: Verify actual Android signatures and negative cases with disposable fixtures
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fLsS --max-time 90 https://github.com/AmritSinghGit/ghartv/releases/download/v0.5.4-rc8/GharTV-Jio-Live-v0.5.4-rc8-pre-birthday-recovery.apk -o /tmp/ghartv-public-reference.apk
          echo '8cff8f85403da5924865fddc687dbff11089d7c498f9863e483a7d8123c1ce13  /tmp/ghartv-public-reference.apk' | sha256sum -c -
          python tools/rc5_native_verify.py
      - name: Real browser review and explicit approval contract using controlled data
        run: |
          npm --prefix web-player ci --ignore-scripts --no-audit --no-fund
          npm --prefix /tmp/ghartv-browser install --ignore-scripts --no-audit --no-fund playwright@1.55.1
          /tmp/ghartv-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/rc7_browser_check.mjs
      - name: Publish checked source on the same branch; do not promote public TV update
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          subprocess.run(['git','add','--',*json.loads(Path('/tmp/ghartv-green-targets.json').read_text())],check=True)
          PY
          git rm -r .green-prep .github/workflows/green-review-build.yml .github/workflows/rc7-source-snapshot.yml
          test -z "$(git diff --cached --name-only -- update/latest.json)"
          git commit -m 'feat: unified GREEN TV web owner review and exact-binary BLUE promotion with network diagnostics'
          git push origin HEAD:refs/heads/$BRANCH
          echo "APPLICATION_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Package complete local review; no owner key or production feed write
        run: |
          set -euo pipefail
          python tools/package_owner_review.py
          gh release create v0.6.0-rc7 /tmp/ghartv-owner-candidate/* --repo AmritSinghGit/ghartv --target "$(git rev-parse HEAD)" --prerelease --title 'GharTV 0.6.0 RC7 — unified GREEN review and release desk' --notes-file REVIEW_060_RC7.md
          echo 'GREEN_REVIEW_BUNDLE_PUBLISHED=YES; OWNER_EXECUTION=NOT_PERFORMED; BLUE_FEED=UNCHANGED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-green-owner-delivery
          path: |
            /tmp/ghartv-owner-candidate/GHARTV_RC7_REVIEW.zip
            /tmp/ghartv-owner-candidate/DELIVERY.json
            /tmp/ghartv-check-evidence/*.png
          retention-days: 2
          if-no-files-found: warn
