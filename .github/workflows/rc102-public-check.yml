name: GharTV public privacy readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rc102-public-check.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public endpoints without credentials or private response retention
        run: |
          mkdir -p /tmp/ghartv-public-privacy
          python - <<'PY'
          import json,urllib.request,urllib.error
          from pathlib import Path
          def status(url,retain_public_home=False):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'GharTV-Public-Privacy-Readback/1.0','Cache-Control':'no-cache'}),timeout=20) as r:
                return r.status,r.read(250000).decode() if retain_public_home else ''
            except urllib.error.HTTPError as e:return e.code,''
          root='https://amritsinghgit.github.io/ghartv/'
          home,html=status(root,True);owner,_=status(root+'owner.html')
          collector,_=status('https://ghartv-telemetry.ghartv-47d9a0.workers.dev/v1/admin/summary?days=1')
          result={'public_home_status':home,'public_owner_page_status':owner,'collector_admin_without_credentials_status':collector,'no_private_body_retained':True,'homepage_has_owner_console_link':'href="./owner.html"' in html or 'href="owner.html"' in html,'viewer_home_preserved':'Your channels.' in html,'status':'PASS' if home==200 and owner==404 and collector in (401,403) and 'href="./owner.html"' not in html else 'REQUIRES_ATTENTION'}
          Path('/tmp/ghartv-public-privacy/PUBLIC_PRIVACY_VALIDATION.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result))
          if result['status']!='PASS':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-public-privacy-readback
          path: /tmp/ghartv-public-privacy/
          retention-days: 7
