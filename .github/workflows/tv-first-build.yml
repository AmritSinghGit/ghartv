name: Nova TV-first preview regression review
on:
  push:
    paths: ['.github/workflows/tv-first-build.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: codex/ghartv-remove-auto-preview
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Apply exact baseline-checked TV correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,json,hashlib
          raw=base64.b64decode(''.join(Path('.tv-first-stage/part'+str(i)).read_text() for i in range(4)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='0ce649c011c5660058f36027a63371776c8f9ef8bc3a06499c3e5ed38a37be42'
          data=json.loads(zlib.decompress(raw));assert len(data['targets'])==25
          assert set(data['base'])==set(data['targets'])==set(data['edits'])
          for name,expected in data['base'].items():
            p=Path(name);assert not p.is_absolute() and '..' not in p.parts
            assert name.startswith(('android-tv/','tools/','docs/')) or name in ('AGENTS.md','CURRENT_HANDOFF.md','GHARTV_LANE_PROGRESS.md','OWNER_REVIEW_REQUIREMENTS.json','TV_EXPERIENCE_CONTRACT.json','REVIEW_060_RC9.md','VALIDATE_SOURCE.command')
            if expected is None:assert not p.exists(),name
            else:assert hashlib.sha256(p.read_bytes()).hexdigest()==expected,name
          for name,edits in data['edits'].items():
            p=Path(name);lines=p.read_text().splitlines(keepends=True) if p.exists() else []
            for first,last,text in reversed(edits):
              assert 0<=first<=last<=len(lines);lines[first:last]=[text]
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(''.join(lines))
            assert hashlib.sha256(p.read_bytes()).hexdigest()==data['targets'][name],name
          Path('/tmp/tv-first-targets.json').write_text(json.dumps(list(data['targets'])))
          print('TV_FIRST_SOURCE_25_FILES_VERIFIED; PUBLIC_FEED_NOT_TOUCHED')
          PY
      - name: Contract, lifecycle, transport and publication safety checks
        run: |
          set -euo pipefail
          bash VALIDATE_SOURCE.command
          python tools/tv-first/check_contract.py
          mkdir -p /tmp/tv-preview-jvm
          javac -d /tmp/tv-preview-jvm android-tv/app/src/main/java/in/ghartv/nova/PreviewGate.java tools/tv-first/PreviewGateSmoke.java
          java -cp /tmp/tv-preview-jvm PreviewGateSmoke
          python tools/performance/check.py
          python tools/release_gate_check.py
          python tools/tv-open/test_reopen.py
          node tools/rc7_transport_check.mjs
          node tools/rc6_receipt_check.mjs
          node tools/support-report-check.mjs
      - name: Browser regression checks with controlled data
        run: |
          set -euo pipefail
          npm --prefix web-player ci --ignore-scripts --no-audit --no-fund
          npm --prefix /tmp/ghartv-browser install --ignore-scripts --no-audit --no-fund playwright@1.55.1
          /tmp/ghartv-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/rc9_browser_check.mjs
      - name: Compile release and Android preview instrumentation
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-30;google_apis;x86_64'
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p android-tv/app/src/debug/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=320x180:rate=24' -f lavfi -i 'sine=frequency=440:sample_rate=44100' -t 20 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 32k -movflags +faststart android-tv/app/src/debug/assets/preview-fixture.mp4
          cd android-tv
          bash gradlew --no-daemon --max-workers=2 :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/tv-first-badging.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          s=Path('/tmp/tv-first-badging.txt').read_text().splitlines()[0]
          assert "name='in.ghartv.nova'" in s and "versionCode='26'" in s and "versionName='0.6.0-rc9-tv-first'" in s
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release-unsigned.apk') as z:assert not any('preview-fixture' in n for n in z.namelist())
          print(s)
          PY
      - name: Real Android controller first-frame mute focus and expiry tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd -n NovaPreviewCI -k 'system-images;android-30;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd NovaPreviewCI -port 5556 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/tv-preview-emulator.log 2>&1 &
          trap 'adb -s emulator-5556 emu kill >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import subprocess,time
          end=time.monotonic()+150
          while time.monotonic()<end:
            try:
              p=subprocess.run(['adb','-s','emulator-5556','shell','getprop','sys.boot_completed'],capture_output=True,text=True,timeout=4)
              if p.stdout.strip()=='1':break
            except subprocess.TimeoutExpired:pass
            time.sleep(2)
          else:raise RuntimeError('CI_EMULATOR_BOOT_TIMEOUT')
          PY
          adb -s emulator-5556 shell input keyevent 82
          adb -s emulator-5556 install -r -g android-tv/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5556 install -r -g android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 150 adb -s emulator-5556 shell am instrument -w -r in.ghartv.nova.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/tv-preview-instrumentation.txt
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/tv-preview-instrumentation.txt').read_text()
          assert 'OK (6 tests)' in s and 'FAILURES' not in s and 'INSTRUMENTATION_FAILED' not in s,s
          print('ACTUAL_ANDROID_PREVIEW_CONTROLLER=6_PASS_LOCAL_VIDEO_NOT_PROVIDER_PLAYBACK')
          PY
      - name: Verify signatures with disposable fixtures and original public certificate reference
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fLsS --max-time 90 https://github.com/AmritSinghGit/ghartv/releases/download/v0.5.4-rc8/GharTV-Jio-Live-v0.5.4-rc8-pre-birthday-recovery.apk -o /tmp/ghartv-public-reference.apk
          echo '8cff8f85403da5924865fddc687dbff11089d7c498f9863e483a7d8123c1ce13  /tmp/ghartv-public-reference.apk' | sha256sum -c -
          python tools/rc5_native_verify.py
      - name: Commit tested TV source on the same branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          p=Path('tools/tv-first/VALIDATION.json')
          p.write_text(json.dumps({'schema':'ghartv.tv-first-validation.v1','workflow_run':os.environ['GITHUB_RUN_ID'],'version':'0.6.0-rc9-tv-first','version_code':26,'actual_android_release_compile':'PASS','production_preview_state_machine_checks':29,'actual_android_controller_tests':6,'android_test_media':'GENERATED_LOCAL_DEBUG_FIXTURE_WITH_AUDIO_NO_PROVIDER_CREDENTIALS','android_coverage':['automatic_first_frame','audio_disabled_and_muted','12_second_stop_no_loop','last_focused_channel_only','Find_focus_cancels_before_fetch','startup_timeout_no_late_picture','explicit_saved_off','resume_same_card'],'browser':'PASS_REAL_HTTP_CHROMIUM_CONTROLLED_DATA','signature_cases':'PASS_DISPOSABLE_FIXTURES','owner_mac_execution':False,'live_provider_playback':False,'production_changed':False,'rollback25_activated':False,'native_flixmomo_playback':'NOT_IMPLEMENTED','tor_routing':'NOT_IMPLEMENTED','new_ui_layout':'NO_REDIRECT_TO_ONE_GUIDE'},indent=2)+'\n')
          names=json.loads(Path('/tmp/tv-first-targets.json').read_text())+[str(p)]
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git rm -r .tv-first-stage .github/workflows/tv-first-build.yml .github/workflows/tv-first-source.yml
          test -z "$(git diff --cached --name-only -- update/latest.json)"
          git commit -m 'fix: restore automatic muted Nova preview with Android-tested lifecycle and locked TV experience contract'
          git push origin HEAD:refs/heads/$BRANCH
          echo "APPLICATION_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Publish complete review bundle, not a production update
        run: |
          set -euo pipefail
          python tools/package_owner_review.py
          gh release create v0.6.0-rc9 /tmp/ghartv-owner-candidate/* --repo AmritSinghGit/ghartv --target "$(git rev-parse HEAD)" --prerelease --title 'Nova RC9 — TV-first automatic preview restored' --notes-file REVIEW_060_RC9.md
          echo 'RC9_COMPILED_BUNDLE_PUBLISHED; OWNER_EXECUTION_PENDING; PRODUCTION_CODE24_UNCHANGED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-tv-first-delivery
          path: |
            /tmp/ghartv-owner-candidate/GHARTV_RC9_REVIEW.zip
            /tmp/ghartv-owner-candidate/DELIVERY.json
            /tmp/tv-preview-instrumentation.txt
            /tmp/tv-preview-emulator.log
            /tmp/ghartv-check-evidence/*.png
            tools/tv-first/VALIDATION.json
          retention-days: 7
          if-no-files-found: warn
