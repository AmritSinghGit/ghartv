name: GharTV RC5 focused build and review delivery
on:
  push:
    paths: ['.github/workflows/owner-rc5-prepare.yml']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      BRANCH: codex/ghartv-remove-auto-preview
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Apply only the verified current-source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          raw=base64.b64decode(''.join(Path('.rc5-prep/part'+str(i)).read_text() for i in range(3)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='b8646a63cde028cdb0723ceff095e4f979ad2a5e35c4acf0815665ac2c25df23'
          data=json.loads(lzma.decompress(raw));assert len(data['targets'])==28
          for name,expected in data['base'].items():
            p=Path(name);assert not p.is_absolute() and '..' not in p.parts
            assert name.startswith(('android-tv/','web-player/','docs/','tools/')) or name in ('CURRENT_HANDOFF.md','GHARTV_LANE_PROGRESS.md','REVIEW_060_RC5.md','VALIDATE_SOURCE.command')
            if expected is None:assert not p.exists(),name
            else:assert hashlib.sha256(p.read_bytes()).hexdigest()==expected,name
          text=data['patch'];assert text[32772:32786]=='}--- /dev/null'
          text=text[:32773]+'\n\\ No newline at end of file\n'+text[32773:]
          patch=Path('/tmp/ghartv-rc5.diff');patch.write_text(text)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,expected in data['targets'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          Path('/tmp/ghartv-rc5-targets.json').write_text(json.dumps(list(data['targets'])))
          print('EXACT_SOURCE_PATCH_VERIFIED=28_FILES')
          PY
      - name: Focused navigation, timeline and message contract checks
        run: |
          set -euo pipefail
          bash VALIDATE_SOURCE.command
          mkdir -p /tmp/ghartv-guide-check
          javac -d /tmp/ghartv-guide-check android-tv/app/src/main/java/in/ghartv/nova/GuideTimeline.java tools/GuideRulesSmoke.java
          java -cp /tmp/ghartv-guide-check GuideRulesSmoke
          node --check web-player/public/app.js
          node --check web-player/owner-gateway.mjs
          node tools/owner-convergence-check.mjs
      - name: Prepare existing web dependency and bounded browser test
        run: |
          npm --prefix web-player ci --ignore-scripts --no-audit --no-fund
          npm --prefix /tmp/ghartv-browser install --ignore-scripts --no-audit --no-fund playwright@1.55.1
          /tmp/ghartv-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/rc5_browser_check.mjs
      - name: Compile the actual release APK
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd android-tv
          bash gradlew --no-daemon --max-workers=2 :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/ghartv-badging.txt
          python - <<'PY'
          from pathlib import Path
          first=Path('/tmp/ghartv-badging.txt').read_text().splitlines()[0]
          assert "name='in.ghartv.nova'" in first and "versionCode='21'" in first and "versionName='0.6.0-rc5-navigation-review'" in first
          print(first)
          PY
      - name: Verify typed Android signature checks including rejection paths
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fLsS --max-time 90 https://github.com/AmritSinghGit/ghartv/releases/download/v0.5.4-rc8/GharTV-Jio-Live-v0.5.4-rc8-pre-birthday-recovery.apk -o /tmp/ghartv-public-reference.apk
          python tools/rc5_native_verify.py
      - name: Publish checked source on the same review branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          paths=json.loads(Path('/tmp/ghartv-rc5-targets.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm -r .rc5-prep .github/workflows/owner-rc5-prepare.yml .github/workflows/owner-rc5-evidence.yml
          test -z "$(git diff --cached --name-only -- update/latest.json)"
          git commit -m 'fix: scoped channel surfing, real Now/Next rows and typed certificate review in RC5'
          git push origin HEAD:refs/heads/$BRANCH
          echo "APPLICATION_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Publish full local review bundle, no owner key or public promotion
        run: |
          set -euo pipefail
          python tools/package_owner_review.py
          gh release create v0.6.0-rc5 /tmp/ghartv-owner-candidate/* --repo AmritSinghGit/ghartv --target "$(git rev-parse HEAD)" --prerelease --title 'GharTV 0.6.0 RC5 — scoped guide and owner review' --notes-file REVIEW_060_RC5.md
          echo 'OWNER_SIGNING_AND_EMULATOR=NOT_EXECUTED; PRODUCTION_FEED=UNCHANGED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghartv-rc5-owner-delivery
          path: |
            /tmp/ghartv-owner-candidate/GHARTV_RC5_REVIEW.zip
            /tmp/ghartv-owner-candidate/DELIVERY.json
            /tmp/ghartv-check-evidence/*.png
          retention-days: 2
          if-no-files-found: warn
