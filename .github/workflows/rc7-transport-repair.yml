name: GharTV RC7 transport repair
on:
  push:
    paths: ['.github/workflows/rc7-transport-repair.yml']
permissions:
  contents: write
jobs:
  focused-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BRANCH: codex/ghartv-remove-auto-preview
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply exact reviewed web patch, no APK or production write
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          base={'web-player/server.mjs':'884ef7c216a450d0d87e77fb0fd287b22122d94007ac6544a9b264689378573b','web-player/public/app.js':'a155a2153c7cc663b85ed844b08c9638b0d1320d162ceaa29a9e9daf3cb1ef4b'}
          for name,h in base.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          subprocess.run(['git','apply','--check','tools/rc7-transport-repair.patch'],check=True)
          subprocess.run(['git','apply','tools/rc7-transport-repair.patch'],check=True)
          after={'web-player/server.mjs':'d578cc7ca37c6ae770c7cb67de96046436dfe2009354b633d97213001aae704c','web-player/public/app.js':'7dbd5e9c764abbc76b10a0541c159262ef54ea12e2a6f21b9e957e446449a544'}
          for name,h in after.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          PY
      - name: Actual localhost HTTP origin checks and controlled provider failures
        run: |
          node --check web-player/server.mjs
          node --check web-player/public/app.js
          node tools/rc7_transport_check.mjs
      - name: Record evidence and commit on the same branch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,os
          note='''# RC7 owner review failed — publication on hold

          Owner run GHARTV-CYAN-10-20260916T163409Z-20455 installed code23/source211c2624f5a553b041c1fc8d2194625f8d6b435a successfully, signed APK6962628dc8a6c670a7341cbbdd3c94a06a5a580e3f4ca71681420e09e80dc9dc. Owner screenshots show guide timeout, exact local Fabric alias rejected by the origin guard, and Android service DNS failures. Installation success is NOT playback acceptance. REJECTED_PLAYBACK_BLOCKED; no promotion.

          Repaired source in this commit: accept only the observed local Fabric player Origin plus existing direct loopback origins, require loopback peer and non-cross-site fetch metadata, retain all preview and owner authentication; load the two catalogue endpoints independently under deadlines and coalesce concurrent refresh; use a bounded in-process last-good guide on refresh failure with explicit stale labeling; provide Retry guide and preserve existing cards/filters/sign-in. Cache is not disk-persistent and cannot restore a guide from a previous server process. A provider failure can still prevent playback. No wildcards, arbitrary forwarded-header trust, token bypass or provider entitlement bypass.

          Actual local HTTP checks pass: known local alias reaches the still-required authentication check, hostile/wrong-port/cross-site Origins are rejected, owner API remains nonce-protected. Controlled-provider tests cover primary504 fallback, concurrent request coalescing, stale cache fallback and stale-age rejection. These are not real authenticated provider playback or browser-rendering proof.

          The Android DNS cause remains unverified without the private per-host NETWORK_CHECK.json. The supplied handoff records a private support ZIP, but that file is not available to this conversation; no private records were fetched. Collector authentication succeeded in the full handoff via VERIFIED_BY_SUPPORT_READ. The safe receipt projection uses an older status spelling and incorrectly renders false; do not rotate credentials. Native helper default NOT_NEEDED is misleading when checks are incomplete; interpret as no restart attempted, not a healthy network.

          Source repair only: no new APK, no release asset changes, no Mac installation, no new Obsidian write, no public update feed/merge/tunnel/cousin-server action. Keep the existing original key, named AVD, app data and one web runtime. Next evidence required: existing filtered support ZIP provided privately. Do not ask for repeated screenshots or another APK install before investigating those per-service results.
          '''
          Path('RC7_REVIEW_FAILURE.md').write_text(note)
          p=Path('CURRENT_HANDOFF.md');p.write_text('# Current owner decision: RC7 PLAYBACK BLOCKED\n\nSee RC7_REVIEW_FAILURE.md. Successful installation is not successful playback. New web source repairs are not installed on the owner Mac. Public promotion remains on hold.\n\n'+p.read_text())
          Path('docs/rc7-transport-validation.json').write_text(json.dumps({'schema':'ghartv.rc7-transport-check.v1','workflow_run':os.environ['GITHUB_RUN_ID'],'test_input_sha':os.environ['GITHUB_SHA'],'result':'PASS','installed_application_source':'211c2624f5a553b041c1fc8d2194625f8d6b435a','application_code_unchanged':23,'private_data_used':False,'native_dns_repaired':False,'live_provider_playback_verified':False,'owner_execution':'NOT_PERFORMED','release_approval':'REJECTED_PLAYBACK_BLOCKED','production_changed':False},indent=2)+'\n')
          PY
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git diff --name-only -- android-tv update/latest.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-player/server.mjs web-player/public/app.js CURRENT_HANDOFF.md RC7_REVIEW_FAILURE.md docs/rc7-transport-validation.json
          git rm tools/rc7-transport-repair.patch .github/workflows/rc7-transport-repair.yml
          git commit -m 'fix: RC7 exact Fabric origin and guide recovery; record failed owner playback review'
          git push origin HEAD:refs/heads/$BRANCH
          echo "REPAIRED_WEB_SOURCE_SHA=$(git rev-parse HEAD)"
