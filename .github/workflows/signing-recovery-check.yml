name: GharTV signing recovery check
on:
  push:
    paths: ['.github/workflows/signing-recovery-check.yml']
permissions:
  contents: read
jobs:
  native-signing-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Ensure the existing target SDK signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Exercise configured signing with a disposable test identity, never a release identity
        shell: python
        run: |
          import ast,hashlib,json,os,secrets,shlex,subprocess,tempfile
          from pathlib import Path
          p=Path('GHARTV_SYNC_CURRENT_AND_REPORT.command');raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='75dcc31ee1a76381077d6733c2538664de1a82d616959ea92fd7cfc3db41e831'
          assert hashlib.sha256(Path('GHARTV_LANE_PROGRESS.md').read_bytes()).hexdigest()=='22592678a72f43141602afe2a1d41544dfdb9949e923aa4fb5f358b2be864bea'
          subprocess.run(['bash','-n',str(p)],check=True)
          source=raw.decode().split("<<'PY'\n",1)[1].split('\nPY\n',1)[0]
          tree=ast.parse(source)
          nodes=[n for n in tree.body if isinstance(n,(ast.Import,ast.ImportFrom,ast.FunctionDef,ast.ClassDef)) or isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='SIGN_KEYS' for x in n.targets)]
          scope={};exec(compile(ast.Module(body=nodes,type_ignores=[]),'review-functions','exec'),scope)
          tools=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          with tempfile.TemporaryDirectory(prefix='ghartv-test-only-') as tmp:
            home=Path(tmp);run=home/'run';run.mkdir();scope.update(HOME=home,RUN=run,r={})
            keys=home/'Library/Application Support/GharTV/signing';keys.mkdir(parents=True)
            key=keys/'ghartv-release.jks';config=keys/'signing.env';unsigned=home/'unsigned.apk';signed=home/'signed.apk'
            store=secrets.token_hex(16);private=secrets.token_hex(16)
            environment=dict(os.environ,TEST_STORE_PASS=store,TEST_KEY_PASS=private)
            subprocess.run(['keytool','-genkeypair','-keystore',str(key),'-storetype','JKS','-alias','validation-only','-keyalg','RSA','-keysize','2048','-validity','1','-dname','CN=DISPOSABLE TEST ONLY NOT GHARTV RELEASE','-storepass:env','TEST_STORE_PASS','-keypass:env','TEST_KEY_PASS','-noprompt'],env=environment,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            key.chmod(0o600)
            values={'GHARTV_SIGNING_STORE':str(key),'GHARTV_SIGNING_STORE_PASSWORD':store,'GHARTV_SIGNING_KEY_ALIAS':'validation-only','GHARTV_SIGNING_KEY_PASSWORD':private}
            def save():
              config.write_text('\n'.join('export '+k+'='+shlex.quote(v) for k,v in values.items())+'\n');config.chmod(0o600)
            save()
            subprocess.run(['curl','--proto','=https','--proto-redir','=https','-fLsS','--max-time','90','https://github.com/AmritSinghGit/ghartv/releases/download/v0.5.5-rc2/GharTV-review-unsigned.apk','-o',str(unsigned)],check=True)
            assert hashlib.sha256(unsigned.read_bytes()).hexdigest()=='32efc94eaa635b3da1d1895570b857e9f5d2dea5b5bed1151818c48d03a7cd21'
            scope['configured_sign'](tools/'apksigner',tools/'zipalign',unsigned,signed,dict(os.environ))
            subprocess.run([str(tools/'apksigner'),'verify',str(signed)],check=True,stdout=subprocess.DEVNULL)
            assert scope['payload'](unsigned)==scope['payload'](signed)
            assert scope['r']['signing_mode']=='EXISTING_LOCAL_CONFIG_NO_PROMPT' and scope['r']['signer_exit_code']==0
            print('NATIVE_CONFIGURED_SIGN_AND_PAYLOAD_VERIFY=PASS')
            values['GHARTV_SIGNING_STORE_PASSWORD']=secrets.token_hex(16);save()
            try:scope['configured_sign'](tools/'apksigner',tools/'zipalign',unsigned,home/'bad.apk',dict(os.environ))
            except scope['Stop']:pass
            else:raise AssertionError('Bad fixture password unexpectedly succeeded')
            report=(run/'signing-diagnostic.json').read_text()
            assert json.loads(report)['category']=='KEYSTORE_PASSWORD_REJECTED'
            assert all(x not in report for x in (store,private,values['GHARTV_SIGNING_STORE_PASSWORD']))
            print('INCORRECT_FIXTURE_PASSWORD_CLASSIFIED_WITHOUT_SECRET_LOG=PASS')
          m=json.loads(Path('update/latest.json').read_text());assert m['versionCode']==14 and m['sourceCommit']=='b46b2cd607c309d364d531b5fd9da618cd007f6c'
          print('NO_TEST_KEYS_OR_APKS_PUBLISHED=YES')
          print('PRODUCTION_UNCHANGED=YES')
