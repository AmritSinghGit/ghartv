name: GharTV persistent TV opener
on:
  push:
    paths: ['.github/workflows/tv-open-build.yml']
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BRANCH: codex/ghartv-remove-auto-preview
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply exact launch-only changes, keep APK and publication hold
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          raw=base64.b64decode(Path('.tv-open-prep.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='4ec9ac862867a58141482f70a83000aa063c7d405a8bd37e8d3d23312e0a397f'
          data=json.loads(lzma.decompress(raw))
          for n,h in data['baseline'].items():assert hashlib.sha256(Path(n).read_bytes()).hexdigest()==h,n
          assert set(data['newfiles'])=={'tools/tv_local.py','tools/tv-open/install_open.py','tools/tv-open/test_tv_open.py','tools/tv-open/BASELINE.json'}
          assert set(data['targets'])=={'tools/release_control.py','docs/owner.html','web-player/release-desk.mjs'}
          p=Path('/tmp/tv-open.diff');p.write_text(data['patch'])
          subprocess.run(['git','apply','--check',str(p)],check=True);subprocess.run(['git','apply',str(p)],check=True)
          for n,h in data['targets'].items():assert hashlib.sha256(Path(n).read_bytes()).hexdigest()==h,n
          for n,text in data['newfiles'].items():
            p=Path(n);assert not p.exists(),n;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for n in ['tools/tv_local.py','tools/tv-open/install_open.py','tools/release_control.py']:compile(Path(n).read_text(),n,'exec')
          print('EXACT_OPENER_SOURCE_VERIFIED; APK_UNCHANGED')
          PY
      - name: Focused launch, rejection, duplicate-instance and owner-interface checks
        run: |
          set -euo pipefail
          python tools/tv-open/test_tv_open.py
          node --check web-player/release-desk.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import vm from 'node:vm';
          const html=await readFile('docs/owner.html','utf8');const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x=>x[1]);
          for(const s of scripts)if(!s.trim().startsWith('{'))new Function(s);
          let source=scripts.find(s=>s.includes('let releaseDesk='));assert.ok(source);source=source.replace(/\nloadReleaseDesk\(\);\s*$/,'');
          const elems={};const $=id=>elems[id]??=({checked:false,disabled:false,addEventListener(){}});
          const box=vm.createContext({$,auth:'local-test-nonce',generation:1,text(){},stamp(){return ''},console,location:{origin:'http://127.0.0.1:8790'},ENDPOINT:'http://127.0.0.1:8790/owner-api',AbortSignal,confirm:()=>false});
          vm.runInContext(source,box);
          vm.runInContext("showRelease({ok:true,green:{state:'NOT_READY',reason:'GREEN_INSTALLATION_NOT_READY'},blue:{},promotion:{}})",box);
          assert.equal(elems.releaseOpenTV.disabled,false);assert.equal(elems.approvePublish.disabled,true);
          vm.runInContext("releaseRequest=async()=>({ok:true,foreground:true,window:'MAC_ACTIVATION_ACCEPTED'})",box);
          await vm.runInContext("releaseAction('open-tv')",box);
          assert.equal(elems.releaseOpenTV.disabled,false);assert.equal(elems.approvePublish.disabled,true);
          vm.runInContext("auth=null;showRelease({ok:true,green:{state:'NOT_READY'},blue:{}})",box);assert.equal(elems.releaseOpenTV.disabled,true);
          const desk=await readFile('web-player/release-desk.mjs','utf8');assert.ok(desk.includes('RC7_PLAYBACK_REVIEW_REJECTED_PUBLICATION_HELD'));assert.ok(desk.includes('authorized(req)'));assert.ok(desk.includes('ORIGIN_REJECTED'));
          console.log('OWNER_ACTION_WHILE_REJECTED_AND_LOCKED_PUBLICATION_HOLD=PASS');
          JS
          node tools/rc7_transport_check.mjs
      - name: Commit on the same branch, no app build or public feed write
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          cat > OPEN_CONTROL_RELEASE.md <<'EOF'
          # Existing TV opener — RC7 unchanged, playback remains blocked

          Latest observed owner recovery11 reports 86460224 bytes /8 items cleaned, web transport repaired, but emulator foreground unconfirmed and insufficient DNS evidence. The source cause of the broken Open TV action is proven: release_control.identity required REVIEW_READY and an already-foregrounded installation before open-tv, while verify_green only located running devices. The browser disabled Open TV when that same readiness gate failed.

          Open TV now independently verifies the saved source and installed APK, reuses the exact named AVD if running, or starts the already-existing AVD at5580 if no matching process/device or port conflict exists. It waits for boot, opens the installed package and checks actual resumed activity. Mac window activation is requested separately. It does not install an APK, require provider connectivity or collector access, read keys, reapprove the review, modify network settings, kill other emulators or clear data. Publication remains held.

          Owner console uses this operation independently of release readiness. A managed Desktop command and GharTV TV.app are installed for repeat opening without rerunning a review installer. An optional local log command captures only the current app PID and bounded existing web log, plus fresh fixed-service DNS observations, network setting values and previous run network/cleanup results. Logs stay private on the Mac; an explicit upload to the conversation is still needed for their detailed contents. Only aggregate technical launch/network outcomes are posted to the existing PR. An action failure remains separate from the log-capture result. No remote Mac access is claimed.

          Tests cover rejected-state launch, no duplicate running/offline instance, actual-foreground requirement, early dispatch independent of release gates, DNS resolution despite ICMP failure, browser button enabled for rejected but disabled for locked sessions, preserved publication hold and existing transport checks. These use controlled fixtures, not actual macOS/QEMU or live provider playback. No new Android candidate is claimed and there is no new cleanup, production, backend, tunnel or cousin-server deployment.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/tv_local.py tools/tv-open/install_open.py tools/tv-open/test_tv_open.py tools/tv-open/BASELINE.json tools/release_control.py docs/owner.html web-player/release-desk.mjs OPEN_CONTROL_RELEASE.md
          git rm .tv-open-prep.b64 .github/workflows/tv-open-build.yml
          test -z "$(git diff --cached --name-only -- android-tv update/latest.json)"
          git commit -m 'fix: open existing TV independently of release readiness; persistent shortcut and private logs'
          git push origin HEAD:refs/heads/$BRANCH
          echo "OPEN_CONTROL_SOURCE=$(git rev-parse HEAD)"
      - name: Package and publish bounded local opener
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile,shutil,subprocess,os
          root=Path('/tmp/ghartv-tv-open');kit=root/'GHARTV_TV_OPEN';kit.mkdir(parents=True)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for src,dst in [('tools/tv-open/install_open.py','install_open.py'),('tools/tv_local.py','tv_local.py'),('tools/recovery-r1/recover_and_clean.py','recover_and_clean.py'),('OPEN_CONTROL_RELEASE.md','README.md')]:shutil.copyfile(src,kit/dst)
          baseline=json.loads(Path('tools/tv-open/BASELINE.json').read_text())
          manifest={'schema':'ghartv.tv-open-delivery.v1','baseline':baseline,'payload':{},'helper_sha256':hashlib.sha256((kit/'tv_local.py').read_bytes()).hexdigest(),'delivery_source':source,'web_source':'21d274237a8756644fa160bca115964498502f45','apk_changed':False,'production':'HELD','owner_execution':'NOT_PERFORMED'}
          for name in baseline:
            p=kit/'payload'/name;p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,p);manifest['payload'][name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (kit/'repair-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (kit/'RUN_GHARTV_TV_OPEN.command').write_text('#!/bin/bash\nset -euo pipefail\numask 077\nexport PYTHONDONTWRITEBYTECODE=1\nexport PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"\ncd "$(dirname "$0")"\nshasum -a 256 -c SHA256SUMS\nexec python3 ./install_open.py\n')
          (kit/'RUN_GHARTV_TV_OPEN.command').chmod(0o700)
          (kit/'VALIDATION.json').write_text(json.dumps({'source':source,'run':os.environ['GITHUB_RUN_ID'],'result':'PASS_FOCUSED_MOCKED_LAUNCH_UI_AND_LOCAL_HTTP_TESTS','actual_mac_execution':False,'actual_playback_verified':False,'new_apk':False,'production_changed':False},indent=2)+'\n')
          (kit/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(kit))+'\n' for p in sorted(kit.rglob('*')) if p.is_file()))
          archive=root/'GHARTV_TV_OPEN.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(kit.rglob('*')):
              if p.is_file():z.write(p,p.relative_to(root))
          with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None
            for line in z.read('GHARTV_TV_OPEN/SHA256SUMS').decode().splitlines():
              h,n=line.split('  ',1);assert hashlib.sha256(z.read('GHARTV_TV_OPEN/'+n)).hexdigest()==h
          delivery={'source':source,'release':'v0.6.0-rc7-open1','filename':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'size':archive.stat().st_size}
          (root/'DELIVERY.json').write_text(json.dumps(delivery,indent=2)+'\n');print(json.dumps(delivery))
          PY
          gh release create v0.6.0-rc7-open1 /tmp/ghartv-tv-open/GHARTV_TV_OPEN.zip /tmp/ghartv-tv-open/DELIVERY.json --repo AmritSinghGit/ghartv --target "$(git rev-parse HEAD)" --prerelease --title 'GharTV TV opener — same RC7 APK, independent local opening' --notes-file OPEN_CONTROL_RELEASE.md
      - uses: actions/upload-artifact@v4
        with:
          name: ghartv-tv-open
          path: |
            /tmp/ghartv-tv-open/GHARTV_TV_OPEN.zip
            /tmp/ghartv-tv-open/DELIVERY.json
          retention-days: 2
