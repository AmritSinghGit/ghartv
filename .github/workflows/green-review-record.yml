name: Record verified GREEN review
on:
  push:
    paths: ['.github/workflows/green-review-record.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Copy verified current handoff and owner launcher, not Android or public feed
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fLsS --max-time 90 https://github.com/AmritSinghGit/ghartv/releases/download/v0.6.0-rc7/GHARTV_RC7_REVIEW.zip -o /tmp/ghartv-green-record.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib,io,json,zipfile
          source='211c2624f5a553b041c1fc8d2194625f8d6b435a';data=Path('/tmp/ghartv-green-record.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='d926b8db27174459463d4e3a466390c56c82a48e9f55cec3364ff8d7cd1d40be'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            assert z.testzip() is None
            for line in z.read('GHARTV_RC7_REVIEW/SHA256SUMS').decode().splitlines():
              h,name=line.split('  ',1);assert hashlib.sha256(z.read('GHARTV_RC7_REVIEW/'+name)).hexdigest()==h
            manifest=json.loads(z.read('GHARTV_RC7_REVIEW/assets/review-manifest.json'));assert manifest['source_sha']==source and manifest['version_code']==23
            companion=z.read('GHARTV_RC7_REVIEW/assets/GharTV-review-companion.zip')
            assert hashlib.sha256(companion).hexdigest()=='5bf6a81097eb74d7b960e3fff67d1399369a29ea5e7fa175e37f9568f26e5a25'
            command=z.read('GHARTV_RC7_REVIEW/GHARTV_SYNC_CURRENT_AND_REPORT.command')
            assert hashlib.sha256(command).hexdigest()=='99fedd034de8816e4c153f65f25eefbbe6a90150f33d2d3d3216e74deda351bb'
          with zipfile.ZipFile(io.BytesIO(companion)) as z:
            for name in ('CURRENT_HANDOFF.md','GHARTV_LANE_PROGRESS.md'):Path(name).write_bytes(z.read(name))
          Path('GHARTV_SYNC_CURRENT_AND_REPORT.command').write_bytes(command)
          candidate={**manifest,'application_source_sha':source,'release_tag':'v0.6.0-rc7','build_run':35106534780,'build_job':104829096690,'owner_decision':'REVIEW_PENDING','full_bundle_sha256':'d926b8db27174459463d4e3a466390c56c82a48e9f55cec3364ff8d7cd1d40be','owner_command_sha256':'99fedd034de8816e4c153f65f25eefbbe6a90150f33d2d3d3216e74deda351bb','owner_signed_apk_sha256':None,'production_approval':False}
          Path('REVIEW_CANDIDATE.json').write_text(json.dumps(candidate,indent=2)+'\n')
          p=Path('.ghartv-owner-state.json');s=json.loads(p.read_text());s.update(current_candidate=manifest['version_name'],current_candidate_sha=source,candidate_branch=manifest['branch'],candidate_pr=1,version_code=23,candidate_release='v0.6.0-rc7',candidate_release_status='COMPILED_GREEN_REVIEW_PUBLISHED_OWNER_EXECUTION_PENDING',unsigned_apk_sha256=manifest['unsigned_sha256'],apk_sha256=None,owner_decision='REVIEW_PENDING',owner_command_sha256=candidate['owner_command_sha256'],owner_command_mode='SINGLE_GREEN_THREE_SURFACE_REVIEW_EXPLICIT_APPROVAL_ONLY',mac_sync='AWAITING_GREEN_RC7_RECEIPT',source_build_run=35106534780,source_build_result='SUCCESS',green='one local named emulator and web8790/owner8790',blue='unchanged public code17',development='read-only source checkout',next_action='Start full RC7 bundle; review all three surfaces. Explicit owner approval is required before exact signed APK upload and update-feed publication. No rebuild or production action during review.');p.write_text(json.dumps(s,indent=2)+'\n')
          evidence={'schema':'ghartv.green-review-validation.v1','application_source_sha':source,'version':'0.6.0-rc7-network-diagnostics','version_code':23,'build_run':35106534780,'build_job':104829096690,'conclusion':'SUCCESS','checks':['actual Android release compilation and aapt package23','typed Android signature valid and invalid paths with disposable fixtures','JVM family/scope/update/network rules','guarded emulator recovery decisions with simulated probes','exact approval/source/run/hash, concurrent feed, asset conflict and readback safeguards with simulated GitHub','private diagnostic projection filters','safe receipt transport fixtures','real HTTP/Chromium manual summary+1000 sample, failure independence, reference lookup, Punjabi scope, keyboard/fullscreen','real browser release desk confirmation/cancellation and locked-state access'],'production_or_owner_key_used_for_fixture_signing':False,'actual_owner_mac_signing':'NOT_PERFORMED','actual_emulator_dns_recovery':'NOT_PERFORMED','live_private_collector_export_read_here':False,'real_production_promotion_tested':False,'public_feed_changed':False,'full_bundle_sha256':candidate['full_bundle_sha256'],'publication_scope':'after approval only: exact Android APK plus public update/download feed; not cloud web hosting or cousin deployment','no_duplicate_repo_runtime_or_tenant':True}
          Path('docs/green-review-validation.json').write_text(json.dumps(evidence,indent=2)+'\n')
          pub=json.loads(Path('update/latest.json').read_text());assert pub['versionCode']==17 and pub['sourceCommit']=='de3106e3e97a9147b06347a3d66c4e5923cdbbcc'
          print('GREEN_CONTROL_IDENTITIES_VERIFIED; BLUE_PUBLIC_FEED_UNCHANGED')
          PY
          bash -n GHARTV_SYNC_CURRENT_AND_REPORT.command
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_HANDOFF.md GHARTV_LANE_PROGRESS.md GHARTV_SYNC_CURRENT_AND_REPORT.command REVIEW_CANDIDATE.json .ghartv-owner-state.json docs/green-review-validation.json
          git rm .github/workflows/green-review-record.yml
          test -z "$(git diff --cached --name-only -- android-tv update/latest.json)"
          git commit -m 'delivery: current GREEN RC7 release desk and verification record; BLUE remains public RC8'
          git push origin HEAD:main
          echo "CONTROL_DELIVERY_SHA=$(git rev-parse HEAD)"
          rm /tmp/ghartv-green-record.zip
