<script>
(()=>{
 const el=id=>document.getElementById(id),b=el('measureHost'),status=el('hostMeasureStatus');
 const local=()=>ENDPOINT.startsWith(location.origin+'/owner-api');
 const token=()=>{if(!local()||!auth)throw Error('Use the local, unlocked owner console.');return auth;};
 const clear=()=>{el('hostMeasureResult').textContent='';for(const id of ['hostPressure','hostDisk','appGuideMs','appPictureMs'])el(id).textContent='—';};
 const display=data=>{if(!data.ok){status.textContent='No saved local measurement.';return;}const r=data.report;status.textContent='Saved observation: '+(r.at_ist||'unknown time')+' · '+(r.status||'unknown');el('hostPressure').textContent=r.memory_pressure||'Not reported';el('hostDisk').textContent=r.disk_free_gib??'—';const xs=r.app_measurements?.samples||[];const last=key=>[...xs].reverse().find(x=>x.metric===key)?.value??'—';el('appGuideMs').textContent=last('guide_ready_ms');el('appPictureMs').textContent=last('first_picture_ms');el('hostMeasureResult').textContent=JSON.stringify(r,null,2);};
 async function measure(capture=false){const epoch=generation;if(capture)b.disabled=true;
  try{const credential=token();if(capture)status.textContent='Measuring locally…';
   const resp=await fetch(ENDPOINT+'/performance/'+(capture?'capture':'latest'),{method:capture?'POST':'GET',headers:{Authorization:'Bearer '+credential},signal:AbortSignal.timeout(capture?48000:4000)});
   const data=await resp.json();if(epoch!==generation)return;if(!resp.ok)throw Error(data.error||data.status||'Request failed');display(data);
  }catch(e){if(epoch===generation)status.textContent='Capture unavailable: '+e.message;}
  finally{if(epoch===generation)b.disabled=!local()||!auth;}
 }
 b.onclick=()=>measure(true);
 el('lock').addEventListener('click',()=>{clear();b.disabled=true;status.textContent='Locked. Local process observations cleared.';});
 el('connect').addEventListener('click',()=>{b.disabled=!local()||!auth;if(!b.disabled)measure();});
 b.disabled=!local()||!auth;if(!b.disabled)measure();else status.textContent='Use the local, unlocked owner console to measure.';
})();
</script>
